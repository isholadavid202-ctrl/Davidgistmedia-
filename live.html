<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta property="og:title" content="Davidgistmedia — Live Broadcast">
  <meta property="og:description" content="Watch our live broadcast — Your Source for Entertainment & Breaking News across Nigeria.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://davidgistmedia.onrender.com/live.html">
  <meta property="og:image" content="https://images.unsplash.com/photo-1470229538611-16ba8c7ffbd7?w=1200&q=80">

  <title>Live | Davidgistmedia</title>
  <link rel="stylesheet" href="styles.css?v=3">
  <link rel="stylesheet" href="bbc.css?v=16">
  <link rel="stylesheet" href="desktop.css?v=4" media="(min-width: 900px)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png">

  <link rel="manifest" href="/manifest.json">
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3106219138870596"
     crossorigin="anonymous"></script>

  <!-- Top bar (same as homepage) -->
  <style>
    .util-bar .wrap{display:flex;justify-content:space-between;align-items:center}
    .top-account-link{color:#bb1919;font-weight:700;text-decoration:none;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
    .masthead{padding-top:12px}
    .masthead .topbar{flex-direction:row;justify-content:space-between;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
    .topbar .brand-title{font-size:clamp(1.35rem,5.6vw,2rem);white-space:nowrap}
    .topbar .icons{display:flex;gap:4px;flex:0 0 80px}
    .topbar .acct{flex:0 0 80px;display:flex;justify-content:flex-end}
    .topbar button{width:36px;height:36px;display:grid;place-items:center;color:var(--ink)}
    .topbar svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .masthead .drawer{display:none;flex-direction:column;align-items:stretch;text-align:left;gap:0;padding:4px 0 8px}
    .masthead .drawer.open{display:flex}
    .drawer a{padding:13px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:.95rem}
    .drawer a:hover{color:var(--red)}
  </style>
</head>
<body>

  <div class="util-bar">
    <div class="wrap">
      <span id="today"></span>
      <a href="profile.html" id="top-account-link" class="top-account-link">Sign in</a>
    </div>
  </div>

  <header class="masthead">
    <div class="wrap topbar">
      <div class="icons">
        <button type="button" id="menu-btn" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
      <a class="brand-title" href="index.html">David<span class="gold">gistmedia</span></a>
      <div class="acct"></div>
    </div>

    <div class="wrap drawer" id="drawer">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="editorial-policy.html">Editorial Policy</a>
      <a href="privacy-policy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="podcasts.html">Podcasts</a>
      <a href="live.html">Live</a>
      <a href="staff.html">Staff login</a>
      <a href="admin.html">Admin login</a>
    </div>

    <nav class="tabs" id="tabs" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="podcasts.html">Podcasts</a>
      <a href="live.html" class="active">Live</a>
    </nav>
  </header>

  <main class="wrap" style="padding-top:28px;padding-bottom:28px">
    <div class="cat-head" style="margin-bottom:18px">
      <div class="left"><span class="bar"></span><h2>Live Broadcast</h2></div>
    </div>
    <div id="live-root">
      <p style="color:var(--muted)">Loading...</p>
    </div>
  </main>

  <!-- Footer (built by js/footer.js) -->
  <div id="site-footer"></div>
  <script src="js/footer.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/live.js?v=5"></script>
  <script src="js/extras.js"></script>

  <script>
    (function () {
      /* Menu */
      var menuBtn = document.getElementById("menu-btn");
      var drawer = document.getElementById("drawer");
      menuBtn.addEventListener("click", function () {
        var open = drawer.classList.toggle("open");
        menuBtn.setAttribute("aria-expanded", open);
      });

      /* Today's date (top strip) */
      var today = document.getElementById("today");
      if (today) today.textContent = new Date().toLocaleDateString("en-NG", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
    })();

    /* Computers: tabs go in the top row, with Watch, Listen and Sign in at the right.
       Phones: tabs sit under the header and Sign in sits in the top strip. */
    (function () {
      var h = document.querySelector("header.masthead");
      var t = document.getElementById("tabs");
      var bar = h.querySelector(".topbar");
      var brand = bar.querySelector(".brand-title");
      var acct = bar.querySelector(".acct");
      var link = document.getElementById("top-account-link");
      var utilWrap = document.querySelector(".util-bar .wrap");
      var mq = window.matchMedia("(min-width: 900px)");

      var watch = document.createElement("a");
      watch.className = "top-extra";
      watch.href = "live.html";
      watch.innerHTML = '<i class="d-dot"></i>Watch';
      var listen = document.createElement("a");
      listen.className = "top-extra";
      listen.href = "podcasts.html";
      listen.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>Listen';

      function layout() {
        if (mq.matches) {
          brand.insertAdjacentElement("afterend", t);
          acct.appendChild(watch);
          acct.appendChild(listen);
          acct.appendChild(link);
        } else {
          h.insertAdjacentElement("afterend", t);
          watch.remove();
          listen.remove();
          utilWrap.appendChild(link);
        }
      }
      layout();
      if (mq.addEventListener) mq.addEventListener("change", layout);
      else if (mq.addListener) mq.addListener(layout);
    })();

    /* Shows the member's name instead of "Sign in" when logged in */
    (async function () {
      var btn = document.getElementById("top-account-link");
      if (!btn || typeof supabaseClient === "undefined") return;
      try {
        var res = await supabaseClient.auth.getUser();
        var user = res.data && res.data.user;
        if (!user) return;
        var p = await supabaseClient.from("profiles").select("full_name").eq("id", user.id).single();
        btn.textContent = (p.data && p.data.full_name) || (user.user_metadata && user.user_metadata.full_name) || "My account";
      } catch (e) {}
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>
</body>
</html>
