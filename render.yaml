services:
    - type: web
    name: davidgistmedia
    env: static
    buildCommand: ""
    staticPublishPath: ./
    headers:
            - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
            - path: /*
        name: X-Content-Type-Options
        value: nosniff
            - path: /*
        name: X-Frame-Options
        value: DENY
            - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
            - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
            - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com
