<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0d0d">
  <title>Staff newsroom | Davidgistmedia</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>

  <div class="util-bar">
    <div class="wrap">
      <span>Staff newsroom</span>
      <a href="index.html">Back to site</a>
    </div>
  </div>

  <header class="masthead">
    <div class="wrap">
      <a href="index.html" style="text-decoration:none">
        <div class="brand-title">David<span class="gold">gistmedia</span></div>
      </a>
    </div>
  </header>

  <main class="admin-shell">

    <div id="login-view" class="admin-card">
      <h2>Staff login</h2>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
        <button type="submit" class="primary" id="login-btn">Log in</button>
        <p class="admin-status" id="login-status"></p>
      </form>
    </div>

    <div id="app-view" style="display:none">
      <div class="admin-card">
        <a href="#" id="logout-link" class="logout-link">Log out</a>
        <h2 id="welcome">Welcome</h2>
        <p id="admin-note" style="display:none;margin-bottom:10px"><a href="admin.html" style="color:var(--red);font-weight:700">Open the admin newsroom</a></p>

        <div id="name-box" style="margin:14px 0 6px;padding:14px;border:1px solid var(--line);border-radius:6px">
          <label for="display-name" style="margin-top:0">Your name (shown on your stories)</label>
          <input type="text" id="display-name" maxlength="60" placeholder="e.g. Amina Bello" autocomplete="name">
          <p id="name-note" style="font-size:0.85rem;color:var(--muted);margin-top:8px"></p>
          <button type="button" class="primary" id="name-save-btn" style="margin-top:12px">Save name</button>
          <p class="admin-status" id="name-status"></p>
        </div>

        <h2 id="form-title" style="margin-top:18px">New story</h2>
        <form id="story-form">
          <input type="hidden" id="story-id">

          <label for="title">Headline</label>
          <input type="text" id="title" required maxlength="200">

          <label for="category">Category</label>
          <select id="category">
            <option value="nigeria">Nigeria</option>
            <option value="politics">Politics</option>
            <option value="entertainment">Entertainment</option>
            <option value="sports">Sports</option>
            <option value="yoruba">Yoruba (Yorùbá)</option>
            <option value="business">Business</option>
            <option value="technology">Technology</option>
            <option value="world">World</option>
            <option value="local">Local</option>
          </select>

          <!-- Yoruba: appears when the category is Yoruba. It adds the section's tag, so the story shows under that section on the Yoruba page. -->
          <div id="yoruba-pick" style="display:none">
            <label for="yoruba-kind">Yoruba section (shows this story under that section on the Yoruba page)</label>
            <select id="yoruba-kind">
              <option value="">Not sure / no section</option>
              <option value="nigeria">Nàìjíríà (Nigeria)</option>
              <option value="politics">Ìṣèlú (Politics)</option>
              <option value="sports">Eré Ìdárayá (Sports)</option>
              <option value="entertainment">Eré Ìnàjú (Entertainment)</option>
              <option value="business">Ìṣòwò (Business)</option>
              <option value="africa">Áfíríkà (Africa)</option>
              <option value="world">Àgbáyé (World)</option>
              <option value="health">Ìlera (Health)</option>
              <option value="education">Ẹ̀kọ́ (Education)</option>
              <option value="technology">Ìmọ̀ Ẹ̀rọ (Technology)</option>
              <option value="culture">Àṣà (Culture)</option>
              <option value="local">Ìròyìn Àdúgbò (Local news)</option>
            </select>
          </div>

          <label for="image_url">Picture link (must start with https://)</label>
          <input type="text" id="image_url" placeholder="https://...">

          <label for="video_url">Video link (optional, must start with https://)</label>
          <input type="text" id="video_url" placeholder="https://...">

          <label for="tags">Tags (optional)</label>
          <input type="text" id="tags">

          <label for="excerpt">Short summary (one or two sentences)</label>
          <textarea id="excerpt" style="min-height:80px" maxlength="300"></textarea>

          <label for="content">Full story</label>
          <textarea id="content" required></textarea>

          <button type="submit" class="primary" id="save-btn">Publish story</button>
          <button type="button" class="primary" id="cancel-btn" style="display:none;background:#6b6b68">Cancel editing</button>
          <p class="admin-status" id="save-status"></p>
        </form>
      </div>

      <div class="admin-list">
        <h2 style="font-family:var(--serif);margin-bottom:12px">My stories</h2>
        <div id="my-list"></div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/staff.js"></script>
  <!-- Yoruba picker: shows a Yoruba section dropdown when the category is Yoruba and keeps the Tags box in step with it. -->
  <script>
    (function () {
      var KEYS = ["nigeria", "politics", "sports", "entertainment", "business", "africa", "world", "health", "education", "technology", "culture", "local"];
      var cat = document.getElementById("category");
      var tags = document.getElementById("tags");
      var pick = document.getElementById("yoruba-pick");
      var sel = document.getElementById("yoruba-kind");
      if (!cat || !tags || !pick || !sel) return;

      function list() {
        return tags.value.split(",").map(function (t) { return t.trim(); }).filter(Boolean);
      }
      function currentKind() {
        var l = list().map(function (t) { return t.toLowerCase(); });
        for (var i = 0; i < KEYS.length; i++) { if (l.indexOf(KEYS[i]) > -1) return KEYS[i]; }
        return "";
      }
      function apply() {
        var l = list().filter(function (t) { return KEYS.indexOf(t.toLowerCase()) === -1; });
        if (cat.value === "yoruba" && sel.value) l.push(sel.value);
        tags.value = l.join(", ");
        last = tags.value;
      }
      var last = tags.value;
      function refresh() {
        var on = cat.value === "yoruba";
        pick.style.display = on ? "block" : "none";
        sel.value = on ? currentKind() : "";
      }
      cat.addEventListener("change", function () {
        if (cat.value !== "yoruba") { sel.value = ""; apply(); }
        refresh();
      });
      sel.addEventListener("change", apply);
      tags.addEventListener("input", function () { last = tags.value; if (cat.value === "yoruba") sel.value = currentKind(); });
      var lastCat = cat.value;
      setInterval(function () {
        if (cat.value !== lastCat || tags.value !== last) { lastCat = cat.value; last = tags.value; refresh(); }
      }, 500);
      refresh();
    })();
  </script>
</body>
</html>
