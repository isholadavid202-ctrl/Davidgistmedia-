<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0d0d">
  <title>Staff newsroom | Davidgistmedia</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>

  <div class="util-bar">
    <div class="wrap">
      <span>Staff newsroom</span>
      <a href="index.html">Back to site</a>
    </div>
  </div>

  <header class="masthead">
    <div class="wrap">
      <a href="index.html" style="text-decoration:none">
        <div class="brand-title">David<span class="gold">gistmedia</span></div>
      </a>
    </div>
  </header>

  <main class="admin-shell">

    <div id="login-view" class="admin-card">
      <h2>Staff login</h2>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
        <button type="submit" class="primary" id="login-btn">Log in</button>
        <p class="admin-status" id="login-status"></p>
      </form>
    </div>

    <div id="app-view" style="display:none">
      <div class="admin-card">
        <a href="#" id="logout-link" class="logout-link">Log out</a>
        <h2 id="welcome">Welcome</h2>
        <p id="admin-note" style="display:none;margin-bottom:10px"><a href="admin.html" style="color:var(--red);font-weight:700">Open the admin newsroom</a></p>

        <h2 id="form-title" style="margin-top:18px">New story</h2>
        <form id="story-form">
          <input type="hidden" id="story-id">

          <label for="title">Headline</label>
          <input type="text" id="title" required maxlength="200">

          <label for="category">Category</label>
          <select id="category">
            <option value="nigeria">Nigeria</option>
            <option value="politics">Politics</option>
            <option value="entertainment">Entertainment</option>
            <option value="sports">Sports</option>
            <option value="business">Business</option>
            <option value="technology">Technology</option>
            <option value="world">World</option>
            <option value="local">Local</option>
          </select>

          <label for="image_url">Picture link (must start with https://)</label>
          <input type="text" id="image_url" placeholder="https://...">

          <label for="video_url">Video link (optional, must start with https://)</label>
          <input type="text" id="video_url" placeholder="https://...">

          <label for="tags">Tags (optional)</label>
          <input type="text" id="tags">

          <label for="excerpt">Short summary (one or two sentences)</label>
          <textarea id="excerpt" style="min-height:80px" maxlength="300"></textarea>

          <label for="content">Full story</label>
          <textarea id="content" required></textarea>

          <button type="submit" class="primary" id="save-btn">Publish story</button>
          <button type="button" class="primary" id="cancel-btn" style="display:none;background:#6b6b68">Cancel editing</button>
          <p class="admin-status" id="save-status"></p>
        </form>
      </div>

      <div class="admin-list">
        <h2 style="font-family:var(--serif);margin-bottom:12px">My stories</h2>
        <div id="my-list"></div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
