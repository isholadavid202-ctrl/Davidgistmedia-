<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos | Davidgistmedia</title>
  <meta name="description" content="Watch short and long videos from Davidgistmedia.">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#0d0d0d;color:#fff}
    body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
    a{color:inherit;text-decoration:none}
    [hidden]{display:none !important}

    .vh-top{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:14px 16px}
    .brand{font:700 1.4rem Georgia,"Times New Roman",serif}
    .brand span{color:#c8102e}
    .back{font-size:.9rem;color:#bbb;font-weight:600}
    .vh-tabs{display:flex;max-width:1200px;margin:0 auto;padding:0 16px;border-bottom:1px solid #222}
    .vh-tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:#999;font-family:inherit;font-size:1rem;font-weight:700;padding:13px 0;cursor:pointer}
    .vh-tabs button.on{color:#fff;border-bottom-color:#c8102e}
    main{max-width:1200px;margin:0 auto;padding:16px}

    /* Short videos */
    #short-feed{position:relative;height:calc(100vh - 140px);height:calc(100dvh - 140px);min-height:420px;max-width:440px;margin:0 auto;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:14px;background:#000;scrollbar-width:none}
    #short-feed::-webkit-scrollbar{display:none}
    .short{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000}
    .short video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
    .short .info{position:absolute;left:0;right:0;bottom:0;padding:70px 76px 16px 16px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);pointer-events:none}
    .short h3{margin:0 0 4px;font-size:1.05rem}
    .short p{margin:0 0 6px;font-size:.9rem;color:#ddd;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .short .views{font-size:.8rem;color:#bbb}
    .mute{position:absolute;top:12px;right:12px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:1rem;cursor:pointer}

    /* Like, comment and share buttons */
    .act{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#fff;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;padding:0}
    .act i{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.5);font-size:1.15rem}
    .act.on i{color:#ff3b57}
    .rail{position:absolute;right:10px;bottom:90px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:16px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
    .bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
    .bar .act{flex-direction:row;gap:8px;padding:10px 18px;border:1px solid #333;border-radius:999px;background:#1a1a1a;font-size:.92rem}
    .bar .act i{width:auto;height:auto;background:none;font-size:1rem}

    /* Long videos */
    #long-grid{display:grid;grid-template-columns:1fr;gap:26px 20px}
    @media(min-width:700px){#long-grid{grid-template-columns:repeat(2,1fr)}}
    @media(min-width:1000px){#long-grid{grid-template-columns:repeat(3,1fr)}}
    .lcard{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font-family:inherit;padding:0;cursor:pointer}
    .thumb{position:relative;aspect-ratio:16/9;background:#1a1a1a;border-radius:10px;overflow:hidden}
    .thumb img,.thumb video{display:block;width:100%;height:100%;object-fit:cover}
    .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
    .thumb .play i{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.62);font-size:1.2rem;padding-left:3px}
    .lcard h3{margin:10px 0 4px;font-size:1.1rem;line-height:1.3;font-weight:600}
    .lcard .meta{font-size:.85rem;color:#9a9a9a}

    .empty{padding:60px 16px;text-align:center;color:#999}

    /* Player window */
    .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto;background:rgba(0,0,0,.93)}
    .modal.open{display:flex}
    .modal-box{width:100%;max-width:960px}
    .player{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
    .player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
    .modal h2{margin:14px 0 6px;font-size:1.25rem}
    .modal p{margin:0;color:#cfcfcf;white-space:pre-line}
    .modal-close{position:fixed;top:12px;right:14px;z-index:60;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#000;font-size:1.4rem;cursor:pointer}

    /* Comments panel */
    .sheet{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
    .sheet.open{display:flex}
    .sheet-box{display:flex;flex-direction:column;width:100%;max-width:560px;max-height:82vh;background:#1a1a1a;border-radius:16px 16px 0 0;overflow:hidden}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #2a2a2a}
    .sheet-head b{font-size:1.05rem}
    .sheet-head button{width:36px;height:36px;border-radius:50%;border:0;background:#2a2a2a;color:#fff;font-size:1.2rem;cursor:pointer}
    #c-list{flex:1;overflow-y:auto;padding:6px 18px;min-height:90px}
    .c-item{padding:12px 0;border-bottom:1px solid #262626}
    .c-item .h{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .c-item .h b{font-size:.95rem}
    .c-item .h span{font-size:.75rem;color:#8f8f8f}
    .c-item p{margin:4px 0 0;font-size:.95rem;color:#ddd;white-space:pre-line;word-break:break-word}
    .c-item .del{background:none;border:0;color:#ff7a8a;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;padding:6px 0 0}
    .c-empty{padding:26px 0;text-align:center;color:#8f8f8f;font-size:.92rem}
    .c-form{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid #2a2a2a;background:#161616}
    .c-form textarea{width:100%;min-height:70px;resize:vertical;background:#0f0f0f;border:1px solid #333;color:#fff;border-radius:8px;padding:10px 12px;font:inherit;font-size:.95rem;outline:none}
    .c-form textarea:focus{border-color:#c8102e}
    .c-form .as{margin:0 0 8px;font-size:.82rem;color:#9a9a9a}
    .c-form button.post{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;background:#c8102e;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    .c-form button.post:disabled{opacity:.6;cursor:default}
    .c-form .note{margin:8px 0 0;font-size:.85rem;min-height:1.2em}
    .c-form .note.err{color:#ff7a8a}
    .c-gate p{margin:0 0 12px;color:#cfcfcf;font-size:.95rem}
    .c-gate a{display:block;padding:12px;border-radius:8px;background:#c8102e;text-align:center;font-weight:700}

    .toast{position:fixed;left:50%;bottom:30px;z-index:90;transform:translateX(-50%);max-width:88vw;padding:11px 18px;border-radius:999px;background:#fff;color:#000;font-size:.9rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
    .toast.show{opacity:1}
  </style>
</head>
<body>

  <div class="vh-top">
    <a class="brand" href="index.html">David<span>gistmedia</span></a>
    <a class="back" href="index.html">&larr; Home</a>
  </div>

  <div class="vh-tabs">
    <button type="button" id="t-short" class="on">Short</button>
    <button type="button" id="t-long">Long</button>
  </div>

  <main>
    <div id="short-feed"></div>
    <div id="long-grid" hidden></div>
  </main>

  <!-- Long video player -->
  <div class="modal" id="modal" aria-hidden="true">
    <button type="button" class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <div class="modal-box">
      <div class="player" id="player"></div>
      <h2 id="m-title"></h2>
      <div class="bar" id="m-actions"></div>
      <p id="m-desc"></p>
    </div>
  </div>

  <!-- Comments panel -->
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-box">
      <div class="sheet-head"><b id="sheet-title">Comments</b><button type="button" id="sheet-close" aria-label="Close comments">&times;</button></div>
      <div id="c-list"></div>
      <div id="c-form"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <div id="site-footer"></div>
  <script src="js/footer.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    (function () {
      var sb = typeof supabaseClient !== "undefined" ? supabaseClient : null;
      var $ = function (id) { return document.getElementById(id); };
      var shorts = [], longs = [];
      var byId = {};
      var commentCounts = {};
      var soundOn = false;
      var counted = {};
      var io = null;
      var likeBusy = false;
      var sheetVideo = null;
      var myUserId = null;

      function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function isHttps(u) { return /^https:\/\//i.test(String(u || "")); }
      function isFile(u) { return /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(String(u || "")); }
      function ytId(url) {
        try {
          var u = new URL(url);
          if (u.hostname.indexOf("youtu.be") > -1) return u.pathname.slice(1);
          if (u.hostname.indexOf("youtube.com") > -1) {
            if (u.searchParams.get("v")) return u.searchParams.get("v");
            var m = u.pathname.match(/\/(shorts|embed)\/([\w-]+)/);
            if (m) return m[2];
          }
        } catch (e) {}
        return null;
      }
      function dateText(d) {
        var t = new Date(d);
        if (isNaN(t.getTime())) return "";
        return t.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "Africa/Lagos" });
      }
      function whenText(d) {
        var t = new Date(d);
        if (isNaN(t.getTime())) return "";
        return t.toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "Africa/Lagos" });
      }
      function viewsText(n) {
        n = Number(n) || 0;
        return n + (n === 1 ? " view" : " views");
      }
      function countView(id) {
        if (!sb || counted[id]) return;
        counted[id] = true;
        sb.rpc("increment_video_views", { video_id: id }).then(function () {}, function () {});
      }

      var toastTimer = null;
      function toast(text) {
        var t = $("toast");
        t.textContent = text;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2400);
      }

      /* ---------- Likes (remembered on this phone) ---------- */
      function getLiked() {
        try { return JSON.parse(localStorage.getItem("dg_vliked_v1") || "[]"); } catch (e) { return []; }
      }
      function setLiked(list) {
        try { localStorage.setItem("dg_vliked_v1", JSON.stringify(list)); } catch (e) {}
      }
      function isLiked(id) { return getLiked().indexOf(id) > -1; }

      function actionsHtml(v) {
        var liked = isLiked(v.id);
        return '<button type="button" class="act' + (liked ? " on" : "") + '" data-act="like" data-id="' + esc(v.id) + '" aria-label="Like">' +
          '<i class="fa-solid fa-heart"></i><span data-lc="' + esc(v.id) + '">' + (Number(v.likes) || 0) + '</span></button>' +
          '<button type="button" class="act" data-act="comment" data-id="' + esc(v.id) + '" aria-label="Comments">' +
          '<i class="fa-solid fa-comment"></i><span data-cc="' + esc(v.id) + '">' + (commentCounts[v.id] || 0) + '</span></button>' +
          '<button type="button" class="act" data-act="share" data-id="' + esc(v.id) + '" aria-label="Share">' +
          '<i class="fa-solid fa-share"></i><span>Share</span></button>';
      }

      function paintLike(id) {
        var v = byId[id];
        if (!v) return;
        document.querySelectorAll('[data-lc="' + id + '"]').forEach(function (el) { el.textContent = Number(v.likes) || 0; });
        document.querySelectorAll('[data-act="like"][data-id="' + id + '"]').forEach(function (b) {
          b.classList.toggle("on", isLiked(id));
        });
      }
      function paintComments(id) {
        document.querySelectorAll('[data-cc="' + id + '"]').forEach(function (el) { el.textContent = commentCounts[id] || 0; });
      }

      async function handleLike(id) {
        var v = byId[id];
        if (!v || likeBusy || !sb) return;
        likeBusy = true;
        var was = isLiked(id);
        var before = Number(v.likes) || 0;
        var after = was ? Math.max(before - 1, 0) : before + 1;

        v.likes = after;
        var list = getLiked().filter(function (x) { return x !== id; });
        if (!was) list.push(id);
        setLiked(list);
        paintLike(id);

        var failed = false;
        try {
          var r = await sb.rpc(was ? "decrement_video_likes" : "increment_video_likes", { video_id: id });
          if (r.error) failed = true;
        } catch (e) { failed = true; }

        if (failed) {
          v.likes = before;
          var back = getLiked().filter(function (x) { return x !== id; });
          if (was) back.push(id);
          setLiked(back);
          paintLike(id);
          toast("Couldn't save that. Please try again.");
        }
        likeBusy = false;
      }

      /* ---------- Share ---------- */
      function shareVideo(id) {
        var v = byId[id];
        if (!v) return;
        var url = location.origin + location.pathname + "?v=" + encodeURIComponent(id);
        if (navigator.share) {
          navigator.share({ title: v.title, url: url }).catch(function () {});
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () { toast("Link copied"); }, function () { window.prompt("Copy this link", url); });
        } else {
          window.prompt("Copy this link", url);
        }
      }

      /* ---------- Comments ---------- */
      async function getUser() {
        try {
          var r = await sb.auth.getSession();
          return r && r.data && r.data.session ? r.data.session.user : null;
        } catch (e) { return null; }
      }
      async function myName(user) {
        var m = (user && user.user_metadata) || {};
        var n = String(m.full_name || m.name || "").trim();
        if (n) return n;
        try {
          var r = await sb.from("profiles").select("full_name").eq("id", user.id).maybeSingle();
          if (r && r.data && r.data.full_name && String(r.data.full_name).trim()) return String(r.data.full_name).trim();
        } catch (e) {}
        return String(user.email || "Reader").split("@")[0];
      }

      function openComments(id) {
        var v = byId[id];
        if (!v) return;
        sheetVideo = id;
        $("sheet-title").textContent = "Comments";
        $("sheet").classList.add("open");
        $("sheet").setAttribute("aria-hidden", "false");
        $("c-list").innerHTML = '<div class="c-empty">Loading...</div>';
        loadComments();
        renderForm();
      }
      function closeComments() {
        $("sheet").classList.remove("open");
        $("sheet").setAttribute("aria-hidden", "true");
        sheetVideo = null;
      }

      async function loadComments() {
        var id = sheetVideo;
        if (!id) return;
        var r = await sb.from("video_comments").select("id,user_id,name,content,created_at")
          .eq("video_id", id).order("created_at", { ascending: false }).limit(100);
        if (id !== sheetVideo) return;
        var list = $("c-list");
        if (r.error) {
          list.innerHTML = '<div class="c-empty">Couldn\'t load comments right now.</div>';
          return;
        }
        var data = r.data || [];
        commentCounts[id] = data.length;
        paintComments(id);
        $("sheet-title").textContent = "Comments" + (data.length ? " (" + data.length + ")" : "");
        if (!data.length) {
          list.innerHTML = '<div class="c-empty">No comments yet. Be the first to say something.</div>';
          return;
        }
        list.innerHTML = data.map(function (c) {
          var mine = myUserId && c.user_id === myUserId;
          return '<div class="c-item"><div class="h"><b>' + esc(c.name || "Reader") + '</b><span>' + whenText(c.created_at) + '</span></div>' +
            '<p>' + esc(c.content) + '</p>' +
            (mine ? '<button type="button" class="del" data-cid="' + esc(c.id) + '">Delete</button>' : "") + '</div>';
        }).join("");
      }

      async function renderForm() {
        var box = $("c-form");
        var user = await getUser();
        myUserId = user ? user.id : null;
        if (!user) {
          box.innerHTML = '<div class="c-form c-gate"><p>Sign in to join the conversation. After you sign in, come back to this page.</p>' +
            '<a href="profile.html">Sign in or create account</a></div>';
          return;
        }
        var name = await myName(user);
        box.innerHTML = '<form class="c-form" id="cf" novalidate>' +
          '<input id="cf-site" autocomplete="off" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">' +
          '<p class="as">Commenting as <b>' + esc(name) + '</b></p>' +
          '<textarea id="cf-text" maxlength="1000" placeholder="Write a comment..."></textarea>' +
          '<button type="submit" class="post" id="cf-btn">Post comment</button>' +
          '<p class="note" id="cf-note" role="status"></p></form>';
        $("cf").addEventListener("submit", function (e) { e.preventDefault(); postComment(user, name); });
        loadComments();
      }

      async function postComment(user, name) {
        var id = sheetVideo;
        var text = $("cf-text").value.trim();
        var note = $("cf-note");
        if ($("cf-site").value.trim()) { $("cf-text").value = ""; return; }
        if (!text || !id) return;
        var btn = $("cf-btn");
        btn.disabled = true;
        note.className = "note";
        note.textContent = "Posting...";
        var r = await sb.from("video_comments").insert({ video_id: id, user_id: user.id, name: name, content: text });
        btn.disabled = false;
        if (r.error) {
          var blocked = r.error.code === "42501" || /row-level security|permission/i.test(r.error.message || "");
          note.className = "note err";
          note.textContent = blocked ? "Please sign in again to post your comment." : "Couldn't post your comment. Try again.";
          return;
        }
        note.textContent = "";
        $("cf-text").value = "";
        loadComments();
      }

      $("c-list").addEventListener("click", async function (e) {
        var b = e.target.closest(".del");
        if (!b) return;
        if (!confirm("Delete your comment?")) return;
        var r = await sb.from("video_comments").delete().eq("id", b.getAttribute("data-cid")).select();
        if (r.error || !r.data || !r.data.length) { toast("Couldn't delete that comment."); return; }
        loadComments();
      });
      $("sheet-close").addEventListener("click", closeComments);
      $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) closeComments(); });

      /* One handler for every like, comment and share button */
      document.addEventListener("click", function (e) {
        var b = e.target.closest("[data-act]");
        if (!b) return;
        var id = b.getAttribute("data-id");
        var act = b.getAttribute("data-act");
        if (act === "like") handleLike(id);
        else if (act === "comment") openComments(id);
        else if (act === "share") shareVideo(id);
      });

      /* ---------- Short videos ---------- */
      function renderShorts() {
        var feed = $("short-feed");
        if (!shorts.length) {
          feed.style.height = "auto";
          feed.style.background = "transparent";
          feed.innerHTML = '<div class="empty">No short videos yet. Check back soon.</div>';
          return;
        }
        feed.innerHTML = shorts.map(function (v) {
          return '<article class="short" data-id="' + esc(v.id) + '">' +
            '<video src="' + esc(v.video_url) + '"' + (v.thumbnail_url ? ' poster="' + esc(v.thumbnail_url) + '"' : "") +
            ' loop muted playsinline preload="metadata"></video>' +
            '<button type="button" class="mute" aria-label="Sound on or off"><i class="fa-solid fa-volume-xmark"></i></button>' +
            '<div class="rail">' + actionsHtml(v) + '</div>' +
            '<div class="info"><h3>' + esc(v.title) + '</h3>' +
            (v.description ? '<p>' + esc(v.description) + '</p>' : "") +
            '<div class="views">' + viewsText(v.views) + ' &middot; ' + dateText(v.created_at) + '</div></div>' +
            '</article>';
        }).join("");

        io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            var v = en.target.querySelector("video");
            if (!v) return;
            if (en.isIntersecting && en.intersectionRatio >= 0.6) {
              v.muted = !soundOn;
              var p = v.play();
              if (p && p.catch) p.catch(function () {});
              countView(en.target.getAttribute("data-id"));
            } else {
              v.pause();
            }
          });
        }, { root: feed, threshold: [0, 0.6, 1] });
        feed.querySelectorAll(".short").forEach(function (el) { io.observe(el); });
      }

      function applySound() {
        document.querySelectorAll("#short-feed video").forEach(function (v) { v.muted = !soundOn; });
        document.querySelectorAll("#short-feed .mute i").forEach(function (i) {
          i.className = soundOn ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
        });
      }

      $("short-feed").addEventListener("click", function (e) {
        if (e.target.closest("[data-act]")) return;
        if (e.target.closest(".mute")) {
          soundOn = !soundOn;
          applySound();
          return;
        }
        var v = e.target.closest(".short") && e.target.closest(".short").querySelector("video");
        if (v) { if (v.paused) v.play().catch(function () {}); else v.pause(); }
      });

      /* ---------- Long videos ---------- */
      function thumbHtml(v) {
        var id = ytId(v.video_url);
        var img = v.thumbnail_url || (id ? "https://img.youtube.com/vi/" + encodeURIComponent(id) + "/hqdefault.jpg" : "");
        var media = img
          ? '<img src="' + esc(img) + '" alt="" loading="lazy">'
          : (isFile(v.video_url) ? '<video src="' + esc(v.video_url) + '#t=0.5" preload="metadata" muted playsinline></video>' : "");
        return '<div class="thumb">' + media + '<div class="play"><i class="fa-solid fa-play"></i></div></div>';
      }

      function renderLongs() {
        var grid = $("long-grid");
        if (!longs.length) {
          grid.style.display = "block";
          grid.innerHTML = '<div class="empty">No long videos yet. Check back soon.</div>';
          return;
        }
        grid.innerHTML = longs.map(function (v, i) {
          return '<button type="button" class="lcard" data-i="' + i + '">' + thumbHtml(v) +
            '<h3>' + esc(v.title) + '</h3>' +
            '<div class="meta">' + dateText(v.created_at) + ' &middot; ' + viewsText(v.views) + '</div></button>';
        }).join("");
      }

      $("long-grid").addEventListener("click", function (e) {
        var card = e.target.closest(".lcard");
        if (card) openVideo(longs[Number(card.getAttribute("data-i"))]);
      });

      function openVideo(v) {
        if (!v) return;
        var id = ytId(v.video_url);
        $("player").innerHTML = id
          ? '<iframe src="https://www.youtube.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0" title="' + esc(v.title) +
            '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>'
          : '<video src="' + esc(v.video_url) + '" controls autoplay playsinline></video>';
        $("m-title").textContent = v.title;
        $("m-actions").innerHTML = actionsHtml(v);
        $("m-desc").textContent = v.description || "";
        $("modal").classList.add("open");
        $("modal").setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        countView(v.id);
      }
      function closeVideo() {
        $("player").innerHTML = "";
        $("modal").classList.remove("open");
        $("modal").setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }
      $("modal-close").addEventListener("click", closeVideo);
      $("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeVideo(); });
      document.addEventListener("keydown", function (e) {
        if (e.key !== "Escape") return;
        if ($("sheet").classList.contains("open")) closeComments(); else closeVideo();
      });

      /* ---------- Tabs ---------- */
      function tab(name) {
        var isShort = name === "short";
        $("t-short").classList.toggle("on", isShort);
        $("t-long").classList.toggle("on", !isShort);
        $("short-feed").hidden = !isShort;
        $("long-grid").hidden = isShort;
        if (!isShort) {
          document.querySelectorAll("#short-feed video").forEach(function (v) { v.pause(); });
        }
      }
      $("t-short").addEventListener("click", function () { tab("short"); history.replaceState(null, "", location.pathname + "#short"); });
      $("t-long").addEventListener("click", function () { tab("long"); history.replaceState(null, "", location.pathname + "#long"); });

      /* ---------- Load ---------- */
      async function loadCommentCounts() {
        try {
          var r = await sb.from("video_comments").select("video_id").limit(5000);
          if (r.error || !r.data) return;
          commentCounts = {};
          r.data.forEach(function (c) { commentCounts[c.video_id] = (commentCounts[c.video_id] || 0) + 1; });
          Object.keys(commentCounts).forEach(paintComments);
        } catch (e) {}
      }

      async function load() {
        if (!sb) {
          $("short-feed").innerHTML = '<div class="empty">Videos are not available right now.</div>';
          return;
        }
        var r = await sb.from("videos").select("*").eq("published", true)
          .order("created_at", { ascending: false }).limit(100);
        if (r.error) {
          $("short-feed").innerHTML = '<div class="empty">Couldn\'t load videos right now. Please try again.</div>';
          return;
        }
        var all = (r.data || []).filter(function (v) { return isHttps(v.video_url); });
        all.forEach(function (v) { byId[v.id] = v; });
        shorts = all.filter(function (v) { return v.kind === "short"; });
        longs = all.filter(function (v) { return v.kind === "long"; });
        renderShorts();
        renderLongs();

        /* A shared link (videos.html?v=...) opens that exact video */
        var wanted = new URLSearchParams(location.search).get("v");
        var target = wanted ? byId[wanted] : null;
        var start;
        if (target) start = target.kind === "long" ? "long" : "short";
        else start = location.hash === "#long" ? "long" : (shorts.length || !longs.length ? "short" : "long");
        tab(start);

        if (target && target.kind === "short") {
          var el = document.querySelector('.short[data-id="' + wanted + '"]');
          if (el) $("short-feed").scrollTop = el.offsetTop;
        } else if (target && target.kind === "long") {
          openVideo(target);
        }

        getUser().then(function (u) { myUserId = u ? u.id : null; });
        loadCommentCounts();
      }
      load();
    })();
  </script>
</body>
</html>
