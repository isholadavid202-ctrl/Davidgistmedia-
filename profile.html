<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile | Davidgistmedia</title>
  <link rel="stylesheet" href="styles.css?v=3">
  <link rel="stylesheet" href="bbc.css?v=14">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
  <main style="max-width:600px; margin:40px auto; padding:20px;">
    <h2>Your Profile & Account</h2>
    <form id="profile-form" style="display:flex; flex-direction:column; gap:16px;">
      
      <div>
        <label style="font-weight:700;">Full Name</label><br>
        <input type="text" id="full-name" required maxlength="60" style="width:100%; padding:10px; margin-top:5px;">
      </div>

      <div>
        <label style="font-weight:700;">Profile Picture (Avatar URL)</label><br>
        <input type="url" id="avatar-url" placeholder="https://example.com/photo.jpg" style="width:100%; padding:10px; margin-top:5px;">
      </div>

      <div>
        <label style="font-weight:700;">Bio / About Yourself</label><br>
        <textarea id="bio" placeholder="Write a short bio about yourself..." rows="4" maxlength="300" style="width:100%; padding:10px; margin-top:5px;"></textarea>
      </div>

      <button type="submit" id="save-btn" class="engage-btn" style="padding:12px; font-weight:700; cursor:pointer;">Save Profile</button>
      <p id="profile-status" style="font-weight:bold;"></p>
    </form>
    <p><a href="index.html">&larr; Go to the homepage</a></p>
  </main>

  <script>
    async function loadUserData() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = "login.html"; // Redirect to login if not signed in
        return;
      }

      // Fetch existing profile data
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();

      if (data) {
        document.getElementById("full-name").value = data.full_name || user.user_metadata?.full_name || "";
        document.getElementById("avatar-url").value = data.avatar_url || "";
        document.getElementById("bio").value = data.bio || "";
      }
    }

    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("profile-status");
      const btn = document.getElementById("save-btn");

      btn.disabled = true;
      status.textContent = "Saving changes...";
      status.style.color = "inherit";

      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return;

      const full_name = document.getElementById("full-name").value.trim();
      const avatar_url = document.getElementById("avatar-url").value.trim();
      const bio = document.getElementById("bio").value.trim();

      const { error } = await supabaseClient.from("profiles").upsert({
        id: user.id,
        full_name,
        avatar_url,
        bio,
        updated_at: new Date()
      });

      btn.disabled = false;

      if (error) {
        status.textContent = "Error saving profile. Please try again.";
        status.style.color = "#b00020";
      } else {
        status.textContent = "Profile updated successfully!";
        status.style.color = "green";
      }
    });

    loadUserData();
  </script>
</body>
</html>
