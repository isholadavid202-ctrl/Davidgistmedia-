<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Center | Davidgistmedia</title>
  <link rel="stylesheet" href="styles.css?v=3">
  <link rel="stylesheet" href="bbc.css?v=16">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --accent-red: #bb1919;
      --text-main: #f0f0f0;
      --text-muted: #aaaaaa;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .account-container {
      max-width: 520px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .fb-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .avatar-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-red);
      background: #2a2a2a;
    }

    .upload-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--accent-red);
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    #file-input { display: none; }

    .user-info h2 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .user-info p {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #141414;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .menu-item i {
      width: 20px;
      text-align: center;
      color: var(--accent-red);
    }

    .form-group {
      margin-top: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .form-control {
      width: 100%;
      background: #141414;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
    }

    .btn-save {
      width: 100%;
      background: var(--accent-red);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 15px;
      cursor: pointer;
    }

    .logout-btn {
      color: #ff4d4d !important;
    }

    .logout-btn i {
      color: #ff4d4d !important;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 0.85rem;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="account-container">
    <a href="index.html" class="nav-back"><i class="fa-solid fa-arrow-left"></i> Back to Homepage</a>

    <div class="fb-card">
      <div class="profile-header">
        <div class="avatar-wrapper">
          <img id="avatar-preview" class="avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="Avatar">
          <label for="file-input" class="upload-badge" id="upload-badge">
            <i class="fa-solid fa-camera"></i>
          </label>
          <input type="file" id="file-input" accept="image/*">
        </div>
        <div class="user-info">
          <h2 id="profile-title-name">Account Center</h2>
          <p id="profile-email">Sign in or manage account</p>
        </div>
      </div>

      <!-- Section shown when user is LOGGED IN -->
      <div id="logged-in-section" style="display:none;">
        <form id="profile-form">
          <div class="form-group">
            <label for="full-name">Display Name</label>
            <input type="text" id="full-name" class="form-control" placeholder="Your full name" required>
          </div>

          <div class="form-group">
            <label for="bio">Bio / About</label>
            <textarea id="bio" class="form-control" rows="3" placeholder="Write a short summary..."></textarea>
          </div>

          <button type="submit" id="save-btn" class="btn-save">Save Profile Changes</button>
          <p id="profile-status" class="status-msg"></p>
        </form>

        <div style="margin-top:20px; border-top:1px solid var(--border-color); padding-top:15px;" class="menu-list">
          <a href="#" id="reset-pw-btn" class="menu-item"><i class="fa-solid fa-key"></i> Change / Reset Password</a>
          <button id="logout-btn" class="menu-item logout-btn" style="width:100%; border:none; text-align:left;"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
        </div>
      </div>

      <!-- Section shown when user is LOGGED OUT -->
      <div id="logged-out-section" style="display:none;">
        <form id="auth-login-form">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" id="login-btn" class="btn-save">Sign In</button>
          <p id="auth-status" class="status-msg"></p>
        </form>
        <div style="margin-top:15px; text-align:center;">
          <a href="#" id="forgot-pw-link" style="color:var(--text-muted); font-size:0.85rem; text-decoration:none;">Forgot Password?</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    let selectedFile = null;
    let currentUserId = null;

    async function initAccountPage() {
      const { data: { user } } = await supabaseClient.auth.getUser();

      if (!user) {
        // User is not logged in: show login form
        document.getElementById("logged-in-section").style.display = "none";
        document.getElementById("logged-out-section").style.display = "block";
        document.getElementById("upload-badge").style.display = "none";
        document.getElementById("profile-title-name").textContent = "Sign In";
        document.getElementById("profile-email").textContent = "Welcome back to Davidgistmedia";
        return;
      }

      // User IS logged in: show profile editing options
      document.getElementById("logged-out-section").style.display = "none";
      document.getElementById("logged-in-section").style.display = "block";
      document.getElementById("upload-badge").style.display = "flex";

      currentUserId = user.id;
      document.getElementById("profile-email").textContent = user.email;

      const { data } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();

      if (data) {
        document.getElementById("full-name").value = data.full_name || "";
        document.getElementById("bio").value = data.bio || "";
        document.getElementById("profile-title-name").textContent = data.full_name || "Account Center";
        if (data.avatar_url) {
          document.getElementById("avatar-preview").src = data.avatar_url;
        }
      } else {
        document.getElementById("full-name").value = user.user_metadata?.full_name || user.email.split("@")[0];
      }
    }

    // Login Form Event Handler
    document.getElementById("auth-login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const status = document.getElementById("auth-status");
      const btn = document.getElementById("login-btn");

      btn.disabled = true;
      status.textContent = "Signing in...";
      status.style.color = "#aaa";

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      btn.disabled = false;
      if (error) {
        status.textContent = error.message;
        status.style.color = "#ff4d4d";
      } else {
        status.textContent = "Success! Reloading...";
        status.style.color = "#4edf72";
        window.location.reload();
      }
    });

    // Image Upload Handler
    document.getElementById("file-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (evt) => {
          document.getElementById("avatar-preview").src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Profile Save Handler
    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUserId) return;

      const status = document.getElementById("profile-status");
      const btn = document.getElementById("save-btn");

      btn.disabled = true;
      status.textContent = "Saving...";
      status.style.color = "#aaa";

      let avatarUrl = document.getElementById("avatar-preview").src;

      if (selectedFile) {
        const fileExt = selectedFile.name.split('.').pop();
        const filePath = `${currentUserId}-${Date.now()}.${fileExt}`;

        const { error: uploadErr } = await supabaseClient
          .storage
          .from('avatars')
          .upload(filePath, selectedFile, { upsert: true });

        if (!uploadErr) {
          const { data: publicUrlData } = supabaseClient
            .storage
            .from('avatars')
            .getPublicUrl(filePath);
            
          avatarUrl = publicUrlData.publicUrl;
        }
      }

      const fullName = document.getElementById("full-name").value.trim();
      const bio = document.getElementById("bio").value.trim();

      const { error } = await supabaseClient.from("profiles").upsert({
        id: currentUserId,
        full_name: fullName,
        bio: bio,
        avatar_url: avatarUrl,
        updated_at: new Date()
      });

      btn.disabled = false;

      if (error) {
        status.textContent = "Error saving profile.";
        status.style.color = "#ff4d4d";
      } else {
        status.textContent = "Profile updated successfully!";
        status.style.color = "#4edf72";
        document.getElementById("profile-title-name").textContent = fullName;
      }
    });

    // Reset Password Handler
    document.getElementById("forgot-pw-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = prompt("Please enter your email to reset your password:");
      if (email) {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/profile.html'
        });
        alert(error ? error.message : "Password reset email sent!");
      }
    });

    // Log Out Handler
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });

    initAccountPage();
  </script>
</body>
</html>
