  <style>
    :root {
      --bg: #ffffff; --ink: #141414; --muted: #666666; --line: #e3e3e3; --card: #f4f4f4;
      --red: #c8102e; --dg-accent: #c8102e;
      --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html[data-theme="dark"] {
      --bg: #101010; --ink: #f0f0f0; --muted: #a6a6a2; --line: #2b2b2b; --card: #1b1b1b;
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.4}
    a{color:inherit;text-decoration:none}
    h1,h2,h3{margin:0}
    [hidden]{display:none !important}

    /* ---------- grey bar: date on the left, account on the right ---------- */
    .sp-util{background:var(--card);border-bottom:1px solid var(--line)}
    .sp-util .in{max-width:1400px;margin:0 auto;padding:7px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--muted)}
    .sp-account{color:var(--ink);font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:65%;white-space:nowrap;padding:6px 0}
    .sp-account span{overflow:hidden;text-overflow:ellipsis}
    .sp-account img{flex:0 0 auto}

    /* ---------- black bar: menu, search, logo, night mode ---------- */
    .sp-top{background:#111;color:#fff}
    .sp-top .in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:6px}
    .sp-brand{margin-left:6px;font:700 1.5rem Georgia,"Times New Roman",serif;color:#fff;white-space:nowrap}
    .sp-brand span{color:#e8344c}
    .sp-spacer{flex:1}
    .sp-btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
    #menu-btn,#search-btn{border:0;width:36px;height:36px}

    /* menu drawer and search bar */
    .sp-drawer{background:#111;border-top:1px solid #2b2b2b}
    .sp-drawer .in{max-width:1400px;margin:0 auto;padding:4px 20px 10px;display:flex;flex-direction:column}
    .sp-drawer a{padding:12px 0;border-bottom:1px solid #2b2b2b;color:#e6e6e6;font-weight:700;font-size:.95rem}
    .sp-drawer a:hover{color:#fff}
    .sp-search{background:var(--card);border-bottom:1px solid var(--line)}
    .sp-search form{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;gap:8px}
    .sp-search input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1rem;font-family:inherit}
    .sp-search button{padding:11px 18px;border:0;border-radius:8px;background:var(--dg-accent);color:#fff;font-weight:800;cursor:pointer;font-family:inherit}

    /* ---------- menu ---------- */
    .sp-nav{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
    .sp-nav .in{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;overflow-x:auto;scrollbar-width:none}
    .sp-nav .in::-webkit-scrollbar{display:none}
    .sp-nav a{flex:0 0 auto;padding:15px 15px 12px;font-weight:700;font-size:.95rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
    .sp-nav a:hover{color:var(--ink)}
    .sp-nav a.on{color:var(--ink);border-bottom-color:var(--dg-accent)}

    main{max-width:1400px;margin:0 auto;padding:24px 20px 8px}
    .sp-page{margin:0 0 20px;font-size:2rem;font-weight:800;text-transform:capitalize}
    .sp-empty{padding:60px 10px;text-align:center;color:var(--muted)}

    /* ---------- story blocks ---------- */
    .ph{display:block;margin:0 0 10px}
    .ph img,.noimg{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;background:var(--card)}
    .kick{display:block;margin:0 0 4px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
    .t{display:block;font-size:1.12rem;font-weight:700;line-height:1.28}
    .meta{display:block;margin-top:6px;font-size:.8rem;color:var(--muted)}
    .pic:hover .t,.item:hover .t,.mr a:hover{text-decoration:underline}

    /* big story with the words on the picture */
    .lead{position:relative;display:block;overflow:hidden;border-radius:10px;background:#111;aspect-ratio:4/5;color:#fff}
    .lead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .lead::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.6) 32%,rgba(0,0,0,0) 65%);pointer-events:none}
    .lead .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 22px 24px}
    .lead .tag{display:inline-block;margin:0 0 10px;padding:5px 10px;border-radius:3px;background:var(--dg-accent);color:#fff;font-size:.72rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
    .lead h2{font-size:1.7rem;font-weight:800;line-height:1.15;color:#fff}
    .lead p{margin:10px 0 0;font-size:1rem;color:#e6e6e6;line-height:1.4}
    .lead .meta{color:#cfcfcf}
    .lead .slides{position:absolute;inset:0;z-index:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .lead .slides::-webkit-scrollbar{display:none}
    .lead .slide{position:relative;flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;background:#000;overflow:hidden}
    .lead .slide img,.lead .slide video,.lead .slide iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;background:#000}
    .lead .v-play,.lead .yt-play{position:absolute;inset:0;z-index:1;width:100%;height:100%;padding:0;border:0;background-color:transparent;background-position:center;background-size:cover;background-repeat:no-repeat;cursor:pointer}
    .lead .yt-play{background-color:#000}
    .lead .v-play span,.lead .yt-play span{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:rgba(0,0,0,.65);border:2px solid #fff}
    .lead .v-play span::after,.lead .yt-play span::after{content:"";position:absolute;left:26px;top:19px;border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent}
    .lead-multi .cap,.lead-media .cap{pointer-events:none}
    .lead-media .cap h2 a{pointer-events:auto}
    .lead-media .cap h2 a:hover{text-decoration:underline}
    .lead.is-playing::after,.lead.is-playing .cap,.lead.is-playing .count{display:none}
    .lead .count{position:absolute;top:12px;right:12px;z-index:3;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-size:.8rem;font-weight:700;pointer-events:none}
    .lead .count svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .hero{display:grid;gap:22px}
    .hero-side{display:grid;gap:22px;align-content:start}
    .row4{display:grid;gap:22px;margin-top:30px;grid-template-columns:repeat(2,minmax(0,1fr))}

    /* headings with a red bar */
    .head{display:flex;align-items:center;gap:10px;margin:0 0 16px}
    .head::before{content:"";width:6px;height:1.3em;background:var(--dg-accent);border-radius:2px}
    .head h2{font-size:1.3rem;font-weight:800}
    .head a{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--muted)}
    .head a:hover{color:var(--ink)}

    .cols{display:grid;gap:36px;margin-top:42px}
    .item{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
    .item:first-of-type{border-top:0;padding-top:0}
    .item .th{flex:0 0 36%}
    .item .th img,.item .th .noimg{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--card)}
    .item .bd{flex:1;min-width:0}
    .item .t{font-size:1.05rem}

    .side .box{background:var(--card);border-radius:10px;padding:18px 18px 8px;margin-bottom:26px}
    .mr{list-style:none;margin:0;padding:0;counter-reset:mr}
    .mr li{counter-increment:mr;display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
    .mr li:first-child{border-top:0;padding-top:4px}
    .mr li::before{content:counter(mr);flex:0 0 auto;min-width:28px;font-size:1.7rem;font-weight:800;line-height:1;color:var(--dg-accent);-webkit-text-stroke:1px rgba(0,0,0,.25)}
    .mr a{font-size:.98rem;font-weight:700;line-height:1.3}

    .sec{margin-top:44px}
    .grid4{display:grid;gap:22px;grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid4 .t{font-size:1rem}

    /* video sections (made by js/video-home.js) use the same red headings */
    .cat-head{margin:0 0 16px}
    .cat-head .left{display:flex;align-items:center;gap:10px}
    .cat-head .bar{display:block;width:6px;height:1.3em;background:var(--dg-accent);border-radius:2px}
    .cat-head h2{font-size:1.3rem;font-weight:800}
    #video-home{margin-top:10px}

    /* the "Get the app" card in night mode */
    html[data-theme="dark"] #dgm-install{background:#1b1b1d;color:#ececea;border-color:#333}
    html[data-theme="dark"] #dgm-install span{color:#bdbdbd}

    /* ---------- small phones ---------- */
    @media (max-width: 520px) {
      .sp-top .in{padding:10px 14px}
      .sp-brand{font-size:1.15rem}
      .sp-util .in{padding:7px 14px}
      .sp-nav .in{padding:0 8px}
      main{padding-left:14px;padding-right:14px}
    }
    @media (max-width: 360px) {
      .sp-brand{font-size:1.02rem}
      .sp-btn{width:30px;height:30px}
    }

    /* ---------- computers ---------- */
    @media (min-width: 900px) {
      main{padding-top:28px}
      .lead{aspect-ratio:16/9}
      .lead h2{font-size:2.1rem;max-width:760px}
      .lead .cap{padding:28px 30px 30px}
      .hero{grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:26px}
      .row4{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}
      .cols{grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:48px}
      .item .th{flex-basis:230px}
      .item .t{font-size:1.2rem}
      .grid4{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}
    }
    @media (min-width: 900px) and (max-width: 1199px) {
      .item .th{flex-basis:190px}
      .lead h2{font-size:1.7rem}
    }
  </style>
</head>

  <!-- Small helpers shared with the other scripts on this page -->
  <script>
    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function getOptimizedImage(url, w) {
      w = w || 650;
      if (!url) return "";
      try {
        if (url.indexOf("unsplash.com") > -1) return url.split("?")[0] + "?w=" + w + "&q=75&auto=format&fit=crop&ar=16:9";
        if (url.indexOf("supabase.co") > -1) return url + (url.indexOf("?") > -1 ? "&" : "?") + "width=" + w + "&quality=75";
      } catch (e) {}
      return url;
    }
    function formatWhen(d) {
      try {
        var t = new Date(d);
        if (isNaN(t.getTime())) return "";
        var day = t.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "Africa/Lagos" });
        var time = t.toLocaleTimeString("en-GB", { hour: "numeric", minute: "2-digit", hour12: true, timeZone: "Africa/Lagos" }).replace(/am|pm/i, function (m) { return m.toUpperCase(); });
        return day + ", " + time;
      } catch (e) { return ""; }
    }
    function timeAgo(d) {
      try {
        var t = new Date(d);
        if (isNaN(t.getTime())) return "";
        var ms = Date.now() - t.getTime();
        if (ms < 0) return "Just now";
        var mins = Math.floor(ms / 60000);
        if (mins < 1) return "Just now";
        if (mins < 60) return mins + (mins === 1 ? " min" : " mins") + " ago";
        var hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + (hrs === 1 ? " hr" : " hrs") + " ago";
        var days = Math.floor(hrs / 24);
        if (days < 7) return days + (days === 1 ? " day" : " days") + " ago";
        return t.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "Africa/Lagos" });
      } catch (e) { return ""; }
    }
  </script>

  <!-- The homepage, drawn in the same style as the Sport page -->
  <script>
    (function () {
      var sb = typeof supabaseClient !== "undefined" ? supabaseClient : null;
      var $ = function (id) { return document.getElementById(id); };

      /* The sections in the menu: [key in the database, name shown] */
      var CATS = [
        ["nigeria", "Nigeria"], ["africa", "Africa"], ["politics", "Politics"],
        ["entertainment", "Entertainment"], ["sports", "Sport"], ["business", "Business"],
        ["technology", "Technology"], ["science", "Science"], ["education", "Education"],
        ["fashion", "Fashion"], ["europe", "Europe"], ["world", "World"], ["local", "Local News"]
      ];
      var LABEL = {};
      CATS.forEach(function (c) { LABEL[c[0]] = c[1]; });

      var all = [];
      var query = "";
      var CACHE_KEY = "dg_home_cache_v3";

      function href(a) { return 'href="article.html?slug=' + encodeURIComponent(a.slug) + '"'; }
      function kickerOf(a) { return LABEL[a.category] || a.category || "News"; }
      function by(a) { return escapeHtml(a.author || "Davidgistmedia") + " &middot; " + timeAgo(a.published_at); }
      function sectionLink(key) { return key === "sports" ? "sport.html" : "#" + key; }

      /* ---------- Verified badge (orange for the owner, blue for verified authors) ---------- */
      var badges = {}, badgesLoaded = null;
      function nkey(n) { return String(n || "").trim().toLowerCase(); }
      function loadBadges() {
        if (badgesLoaded) return badgesLoaded;
        badgesLoaded = (async function () {
          try {
            var r = await sb.from("verified_authors").select("name,title,kind");
            (r.data || []).forEach(function (x) { badges[nkey(x.name)] = x; });
          } catch (e) {}
        })();
        return badgesLoaded;
      }
      function badgeFor(name) {
        var b = badges[nkey(name)];
        if (!b) return "";
        var color = b.kind === "owner" ? "#f97316" : "#1d9bf0", pts = [];
        for (var i = 0; i < 48; i++) {
          var ang = (i / 48) * Math.PI * 2, r = 9.2 + 1.1 * Math.cos(8 * ang);
          pts.push((12 + r * Math.cos(ang)).toFixed(2) + "," + (12 + r * Math.sin(ang)).toFixed(2));
        }
        var t = escapeHtml(b.title);
        return '<svg viewBox="0 0 24 24" width="18" height="18" role="img" aria-label="' + t + '" style="display:inline-block;vertical-align:-3px;margin-left:1px"><title>' + t + '</title><polygon points="' + pts.join(" ") + '" fill="' + color + '"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      }
      function leadBy(a) {
        var name = a.author || "Davidgistmedia";
        return escapeHtml(name) + badgeFor(name) + " &middot; " + timeAgo(a.published_at);
      }

      /* ---------- Story blocks ---------- */
      function picture(a, w) {
        return a.image_url ? '<img src="' + escapeHtml(getOptimizedImage(a.image_url, w)) + '" alt="" loading="lazy">' : '<span class="noimg"></span>';
      }
      function pic(a) {
        return '<a class="pic" ' + href(a) + '><span class="ph">' + picture(a, 600) + '</span>' +
          '<span class="kick">' + escapeHtml(kickerOf(a)) + '</span><h3 class="t">' + escapeHtml(a.title) + '</h3>' +
          '<span class="meta">' + timeAgo(a.published_at) + '</span></a>';
      }
      /* ---------- Big story: one picture, or a slideshow when there are more ---------- */
      var slideTimer = null;
      function isHttps(u) { return /^https:\/\//i.test(String(u || "")); }
      function pictureList(v) {
        var list = v;
        if (typeof list === "string") { try { list = JSON.parse(list); } catch (e) { list = []; } }
        return Array.isArray(list) ? list.filter(isHttps) : [];
      }
      function leadPictures(a) { return [a.image_url].concat(pictureList(a.images)).filter(isHttps).slice(0, 6); }
      function videoList(a) { return String(a.video_url || "").split(/[\s,]+/).filter(isHttps).slice(0, 4); }
      function youtubeId(url) {
        var m = String(url || "").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
        return m ? m[1] : null;
      }
      var CAMERA = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>';
      function slideImg(u, i) {
        return '<div class="slide"><img src="' + escapeHtml(getOptimizedImage(u, 1200)) + '" alt="" draggable="false" ' +
          (i === 0 ? 'fetchpriority="high"' : 'loading="lazy"') + '></div>';
      }
      function slideVideo(u, poster) {
        var yt = youtubeId(u);
        if (yt) {
          var thumb = poster ? getOptimizedImage(poster, 1200) : "https://i.ytimg.com/vi/" + yt + "/hqdefault.jpg";
          return '<div class="slide slide-v"><button type="button" class="yt-play" data-yt="' + yt + '" aria-label="Play video" style="background-image:url(\'' + escapeHtml(thumb) + '\')"><span></span></button></div>';
        }
        var src = u.indexOf("#") === -1 ? u + "#t=0.1" : u;
        return '<div class="slide slide-v"><video preload="metadata" playsinline' +
          (poster ? ' poster="' + escapeHtml(getOptimizedImage(poster, 1200)) + '"' : '') +
          ' src="' + escapeHtml(src) + '"></video><button type="button" class="v-play" aria-label="Play video"><span></span></button></div>';
      }
      function lead(a) {
        var caption = '<div class="cap"><span class="tag">' + escapeHtml(kickerOf(a)) + '</span>';
        var tail = (a.excerpt ? '<p>' + escapeHtml(a.excerpt) + '</p>' : '') + '<span class="meta">' + leadBy(a) + '</span></div>';
        var videos = videoList(a);

        /* a story with video: the video fills the card; extra pictures make it a slideshow */
        if (videos.length) {
          var poster = isHttps(a.image_url) ? a.image_url : "";
          var items = videos.map(function (u) { return slideVideo(u, poster); })
            .concat(pictureList(a.images).slice(0, 5).map(slideImg));
          var many = items.length > 1;
          return '<div class="lead lead-story lead-media' + (many ? ' lead-multi' : '') + '">' +
            '<div class="slides">' + items.join("") + '</div>' +
            (many ? '<div class="count" aria-hidden="true">' + CAMERA + '<span>1</span>/' + items.length + '</div>' : '') +
            caption + '<h2><a ' + href(a) + '>' + escapeHtml(a.title) + '</a></h2>' + tail + '</div>';
        }

        /* a story with more than one picture: a slideshow */
        var pics = leadPictures(a), multi = pics.length > 1, media = "";
        if (multi) {
          media = '<div class="slides">' + pics.map(slideImg).join("") + '</div>' +
            '<div class="count" aria-hidden="true">' + CAMERA + '<span>1</span>/' + pics.length + '</div>';
        } else if (a.image_url) {
          media = '<img src="' + escapeHtml(getOptimizedImage(a.image_url, 1200)) + '" alt="" fetchpriority="high">';
        }
        return '<a class="lead lead-story' + (multi ? ' lead-multi' : '') + '" ' + href(a) + '>' + media +
          caption + '<h2>' + escapeHtml(a.title) + '</h2>' + tail + '</a>';
      }

      /* makes the slideshow move by itself, shows the 1/3 counter, and plays videos when tapped */
      function wireLead(root) {
        if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
        root.querySelectorAll(".lead").forEach(function (card) {
          var slides = card.querySelector(".slides");
          if (!slides) return;
          var list = [].slice.call(slides.children);
          var counter = card.querySelector(".count span");
          var paused = false, idx = 0;

          function bind(slide) {
            var yt = slide.querySelector(".yt-play"), vp = slide.querySelector(".v-play");
            if (yt) yt.addEventListener("click", function () {
              var frame = document.createElement("iframe");
              frame.src = "https://www.youtube-nocookie.com/embed/" + yt.getAttribute("data-yt") + "?autoplay=1&playsinline=1&rel=0";
              frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
              frame.allowFullscreen = true;
              frame.title = "Video player";
              yt.parentElement.replaceChild(frame, yt);
              slide.dataset.playing = "1";
              card.classList.add("is-playing");
            });
            if (vp) vp.addEventListener("click", function () {
              var v = slide.querySelector("video");
              v.controls = true;
              slide.dataset.playing = "1";
              card.classList.add("is-playing");
              vp.remove();
              var pr = v.play();
              if (pr && pr.catch) pr.catch(function () {});
            });
          }
          function reset(slide) {
            if (!slide.dataset.playing) return;
            var v = slide.querySelector("video");
            if (v) v.pause();
            slide.innerHTML = slide.dataset.orig;
            delete slide.dataset.playing;
            bind(slide);
            card.classList.remove("is-playing");
          }
          list.forEach(function (slide) {
            if (slide.classList.contains("slide-v")) { slide.dataset.orig = slide.innerHTML; bind(slide); }
          });

          slides.addEventListener("scroll", function () {
            var w = slides.clientWidth || 1;
            var i = Math.round(slides.scrollLeft / w);
            if (counter) counter.textContent = String(i + 1);
            if (i !== idx) { idx = i; list.forEach(reset); }
          }, { passive: true });

          if (list.length > 1) {
            ["touchstart", "pointerdown", "wheel"].forEach(function (ev) {
              slides.addEventListener(ev, function () { paused = true; }, { passive: true });
            });
            slideTimer = setInterval(function () {
              if (paused || document.hidden || card.classList.contains("is-playing")) return;
              var w = slides.clientWidth || 1;
              var i = Math.round(slides.scrollLeft / w);
              if (list[i] && list[i].classList.contains("slide-v")) return;
              slides.scrollTo({ left: ((i + 1) % list.length) * w, behavior: "smooth" });
            }, 4000);
          }
        });
      }
      function item(a) {
        return '<a class="item" ' + href(a) + '><span class="th">' + picture(a, 400) + '</span>' +
          '<span class="bd"><span class="kick">' + escapeHtml(kickerOf(a)) + '</span><h3 class="t">' + escapeHtml(a.title) + '</h3>' +
          '<span class="meta">' + by(a) + '</span></span></a>';
      }
      function head(title, link, linkText) {
        return '<div class="head"><h2>' + escapeHtml(title) + '</h2>' + (link ? '<a href="' + link + '">' + linkText + '</a>' : '') + '</div>';
      }

      /* ---------- Menu ---------- */
      function renderNav(active) {
        var links = ['<a href="#" data-k="home" class="' + (active === "home" ? "on" : "") + '">Home</a>'];
        CATS.forEach(function (c) {
          if (c[0] === "sports") links.push('<a href="sport.html">Sport</a>');
          else links.push('<a href="#' + c[0] + '" data-k="' + c[0] + '" class="' + (active === c[0] ? "on" : "") + '">' + escapeHtml(c[1]) + '</a>');
        });
        links.push('<a href="podcasts.html">Podcasts</a>', '<a href="live.html">Live</a>', '<a href="videos.html">Videos</a>');
        $("sp-nav").innerHTML = links.join("");
      }

      /* ---------- Pages ---------- */
      function homePage() {
        var list = all.slice();
        if (!list.length) return { top: '<div class="sp-empty">No stories yet.</div>', rest: "" };
        var lead0 = list.find(function (a) { return a.featured; }) || list[0];
        var pool = list.filter(function (a) { return a.id !== lead0.id; });
        function take(n) { return pool.splice(0, n); }
        var side = take(2), row = take(4), latest = take(8);

        var liked = list.filter(function (a) { return (a.likes || 0) > 0; })
          .sort(function (a, b) { return (b.likes || 0) - (a.likes || 0); }).slice(0, 5);
        if (!liked.length) liked = list.slice(0, 5);

        var top = '<div class="hero"><div>' + lead(lead0) + '</div><div class="hero-side">' + side.map(pic).join("") + '</div></div>';
        if (row.length) top += '<div class="row4">' + row.map(pic).join("") + '</div>';
        top += '<div class="cols"><div>' + head("Latest news") +
          (latest.length ? latest.map(item).join("") : '<div class="sp-empty" style="padding:20px 0;text-align:left">More stories soon.</div>') +
          '</div><aside class="side"><div class="box">' + head("Most liked") +
          '<ol class="mr">' + liked.map(function (a) { return '<li><a ' + href(a) + '>' + escapeHtml(a.title) + '</a></li>'; }).join("") + '</ol></div></aside></div>';

        /* a section for each category that still has stories */
        var rest = "";
        CATS.forEach(function (c) {
          var items = pool.filter(function (a) { return a.category === c[0]; }).slice(0, 4);
          if (items.length < 2) return;
          rest += '<section class="sec">' + head(c[1], sectionLink(c[0]), "More " + escapeHtml(c[1]) + " &rsaquo;") +
            '<div class="grid4">' + items.map(pic).join("") + '</div></section>';
        });
        return { top: top, rest: rest };
      }

      function categoryPage(key) {
        var list = all.filter(function (a) { return a.category === key; });
        var html = '<h1 class="sp-page">' + escapeHtml(LABEL[key]) + '</h1>';
        if (!list.length) return html + '<div class="sp-empty">No ' + escapeHtml(LABEL[key]) + ' stories yet.</div>';
        var pool = list.slice();
        var lead0 = pool.shift(), side = pool.splice(0, 2), rest = pool;
        html += '<div class="hero"><div>' + lead(lead0) + '</div><div class="hero-side">' + side.map(pic).join("") + '</div></div>';
        if (rest.length) html += '<section class="sec">' + head("More " + LABEL[key]) + '<div class="grid4">' + rest.map(pic).join("") + '</div></section>';
        return html;
      }

      function searchPage(q) {
        var list = all.filter(function (a) {
          return (a.title || "").toLowerCase().indexOf(q) > -1 || (a.excerpt || "").toLowerCase().indexOf(q) > -1;
        });
        var html = '<h1 class="sp-page">Search results</h1>';
        if (!list.length) return html + '<div class="sp-empty">No stories match &ldquo;' + escapeHtml(q) + '&rdquo;.</div>';
        return html + '<div class="grid4">' + list.map(pic).join("") + '</div>';
      }

      function show() {
        if (!all.length && !sb) return;
        var key = location.hash.replace("#", "");
        if (!LABEL[key] || key === "sports") key = "home";
        var q = query.trim().toLowerCase();
        var vh = $("video-home");
        renderNav(q ? "" : key);

        if (q) {
          $("hero-section").innerHTML = searchPage(q);
          $("dg-rest").innerHTML = "";
          if (vh) vh.hidden = true;
        } else if (key === "home") {
          var p = homePage();
          $("hero-section").innerHTML = p.top;
          $("dg-rest").innerHTML = p.rest;
          if (vh) vh.hidden = false;
        } else {
          $("hero-section").innerHTML = categoryPage(key);
          $("dg-rest").innerHTML = "";
          if (vh) vh.hidden = true;
        }
        wireLead($("hero-section"));
        document.title = (key === "home" || q ? "Davidgistmedia | Home" : LABEL[key] + " | Davidgistmedia");
      }

      window.addEventListener("hashchange", function () { query = ""; $("search-input").value = ""; show(); window.scrollTo(0, 0); });
      /* the "Home" menu link has no hash */
      $("sp-nav").addEventListener("click", function (e) {
        var a = e.target.closest("a[data-k=home]");
        if (!a) return;
        e.preventDefault();
        query = ""; $("search-input").value = "";
        history.pushState(null, "", location.pathname);
        show(); window.scrollTo(0, 0);
      });

      /* ---------- Date, search, menu and night mode buttons ---------- */
      var today = $("today");
      if (today) {
        var shortDate = window.innerWidth < 600;
        today.textContent = new Date().toLocaleDateString("en-NG", shortDate
          ? { weekday: "short", day: "numeric", month: "short", year: "numeric" }
          : { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      }
      $("search-btn").addEventListener("click", function () {
        var bar = $("search-bar");
        bar.hidden = !bar.hidden;
        this.setAttribute("aria-expanded", String(!bar.hidden));
        if (!bar.hidden) $("search-input").focus();
      });
      $("search-form").addEventListener("submit", function (e) { e.preventDefault(); query = $("search-input").value; show(); });
      $("search-input").addEventListener("input", function (e) { query = e.target.value; show(); });
      $("menu-btn").addEventListener("click", function () {
        var d = $("drawer");
        d.hidden = !d.hidden;
        this.setAttribute("aria-expanded", String(!d.hidden));
      });

      var themeIcon = $("theme-icon");
      var MOON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      var SUN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      function syncIcon() {
        var dark = document.documentElement.getAttribute("data-theme") === "dark";
        if (themeIcon) themeIcon.innerHTML = dark ? SUN : MOON;
        document.body.classList.toggle("dark-mode", dark);
      }
      syncIcon();
      $("theme-toggle-btn").addEventListener("click", function () {
        var dark = document.documentElement.getAttribute("data-theme") !== "dark";
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        syncIcon();
        try { localStorage.setItem("dg_theme", dark ? "dark" : "light"); localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      });

      /* ---------- Load the stories ---------- */
      function readCache() {
        try { var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); return c && Array.isArray(c.articles) ? c.articles : null; } catch (e) { return null; }
      }
      function writeCache(list) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), articles: list })); } catch (e) {}
      }
      async function load() {
        var cached = readCache();
        if (cached && cached.length) { all = cached; show(); }
        if (sb) loadBadges().then(function () { if (all.length) show(); });
        if (!sb) {
          if (!cached) $("hero-section").innerHTML = '<div class="sp-empty">Stories are not available right now.</div>';
          return;
        }
        var base = "id,slug,title,excerpt,image_url,category,author,published_at,likes,featured";
        var sets = [base + ",images,video_url", base + ",images", base];
        var res = null;
        for (var i = 0; i < sets.length; i++) {
          res = await sb.from("articles").select(sets[i]).order("published_at", { ascending: false }).limit(100);
          if (!res.error) break;
          if (!/images|video_url|column/i.test(res.error.message || "")) break;
        }
        if (res.error) {
          if (!cached || !cached.length) $("hero-section").innerHTML = '<div class="sp-empty">Couldn\'t load stories right now. Please try again.</div>';
          return;
        }
        all = (res.data || []).filter(function (a) { return a && a.slug && a.title; });
        await loadBadges();
        writeCache(all);
        show();
      }
      renderNav("home");
      load();
    })();

    // Dynamic Account Check
    async function updateHeaderAccount() {
      const accountBtn = document.getElementById("top-account-link");
      if (!accountBtn || typeof supabaseClient === "undefined") return;
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          accountBtn.href = "profile.html";
          const { data: profile } = await supabaseClient
            .from("profiles")
            .select("full_name, avatar_url")
            .eq("id", user.id)
            .single();
          const displayName = profile?.full_name || user.user_metadata?.full_name || "My account";
          const avatarUrl = profile?.avatar_url;
          if (avatarUrl) {
            accountBtn.innerHTML = `
              <img src="${escapeHtml(avatarUrl)}" alt="" style="width:18px; height:18px; border-radius:50%; object-fit:cover; border:1px solid #e8344c;">
              <span>${escapeHtml(displayName)}</span>
            `;
          } else {
            accountBtn.innerHTML = "<span>" + escapeHtml(displayName) + "</span>";
          }
        } else {
          accountBtn.textContent = "Sign in";
          accountBtn.href = "profile.html";
        }
      } catch (e) {
        console.error("Auth check error:", e);
      }
    }
    document.addEventListener("DOMContentLoaded", updateHeaderAccount);
  </script>

  <script src="js/live-audio-home.js?v=2"></script>
  <script src="js/podcast-home.js"></script>
  <script src="js/video-home.js?v=2"></script>
  <script src="js/install-banner.js?v=1"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>
