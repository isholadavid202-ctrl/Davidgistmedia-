  <style>
    /* Night mode colors: headlines, lines, cards and muted text all use these */
    html[data-theme="dark"],
    body.dark-mode {
      --ink: #ececea;
      --paper: #1b1b1d;
      --page: #121213;
      --line: #2f2f31;
      --muted: #a3a3a0;
      --near-black: #0a0a0b;
      --red: #e8344c;
      color-scheme: dark;
    }
    html[data-theme="dark"] body,
    body.dark-mode {
      background-color: #121212 !important;
      color: #ffffff !important;
    }
    html[data-theme="dark"] a,
    body.dark-mode a { color: #ffffff; }
    html[data-theme="dark"] .empty-state,
    body.dark-mode .empty-state {
      background: #18181a;
      border-color: #3a3a3d;
    }
    html[data-theme="dark"] .secondary-item > div[style],
    body.dark-mode .secondary-item > div[style] {
      background: #2a2a2d !important;
    }
  </style>

<body>

  <!-- Header like CNN: menu button, logo and a red button. It stays at the top while you scroll.
       Search, the sections list, the other pages and night mode are all inside the menu. -->
  <header class="dgh" id="site-header">
    <div class="wrap dgh-bar">
      <button type="button" class="dgh-menu" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="drawer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <a class="brand-title" href="/">David<span class="gold">gistmedia</span></a>
      <a href="profile.html" id="top-account-link" class="top-account-link">Sign in</a>
    </div>

    <div class="dgh-drawer" id="drawer">
      <div class="wrap">
        <form class="dgh-search" id="search-form">
          <input type="text" id="search-input" placeholder="Search news..." aria-label="Search news">
          <button type="submit">Search</button>
        </form>

        <nav class="dgh-nav" id="tabs" aria-label="Sections">
          <button class="active" data-cat="all">Home</button>
          <button data-cat="nigeria">Nigeria</button>
          <button data-cat="politics">Politics</button>
          <button data-cat="entertainment">Entertainment</button>
          <button data-cat="sports">Sports</button>
          <button data-cat="business">Business</button>
          <button data-cat="technology">Technology</button>
          <button data-cat="world">World</button>
          <button data-cat="local">Local News</button>
          <a href="podcasts.html">Podcasts</a>
          <a href="live.html">Live</a>
          <a href="videos.html">Videos</a>
        </nav>

        <div class="dgh-more">
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a href="editorial-policy.html">Editorial Policy</a>
          <a href="privacy-policy.html">Privacy</a>
          <a href="terms.html">Terms</a>
          <a href="staff.html">Staff login</a>
          <a href="admin.html">Admin login</a>
        </div>

        <button type="button" id="theme-toggle-btn" class="dgh-theme" aria-label="Toggle dark mode">
          <i class="fa-regular fa-moon" id="theme-icon"></i>
          <span id="theme-label">Switch to dark mode</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero-section" id="hero-section"></section>

  <script>
    // Menu: opens and closes the panel under the header
    (function () {
      var menuBtn = document.getElementById("menu-btn");
      var drawer = document.getElementById("drawer");
      var tabs = document.getElementById("tabs");
      var form = document.getElementById("search-form");
      if (!menuBtn || !drawer) return;

      var BARS = "M3 6h18M3 12h18M3 18h18";
      var CROSS = "M5 5l14 14M19 5L5 19";

      function setOpen(open) {
        drawer.classList.toggle("open", open);
        menuBtn.setAttribute("aria-expanded", String(open));
        menuBtn.setAttribute("aria-label", open ? "Close menu" : "Menu");
        var path = menuBtn.querySelector("path");
        if (path) path.setAttribute("d", open ? CROSS : BARS);
      }

      menuBtn.addEventListener("click", function () {
        setOpen(!drawer.classList.contains("open"));
      });
      // Choosing a section closes the menu and goes back to the top
      if (tabs) tabs.addEventListener("click", function (e) {
        if (e.target.closest("button[data-cat]")) {
          setOpen(false);
          window.scrollTo(0, 0);
        }
      });
      if (form) form.addEventListener("submit", function () {
        setOpen(false);
        window.scrollTo(0, 0);
      });
      document.addEventListener("click", function (e) {
        if (drawer.classList.contains("open") && !e.target.closest("#site-header")) setOpen(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") setOpen(false);
      });
    })();

    // Night Mode Toggle Functionality
    (function () {
      const themeBtn = document.getElementById("theme-toggle-btn");
      const themeIcon = document.getElementById("theme-icon");
      const themeLabel = document.getElementById("theme-label");

      function applyTheme(isDark) {
        document.body.classList.toggle("dark-mode", isDark);
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        if (themeIcon) themeIcon.className = isDark ? "fa-solid fa-sun" : "fa-regular fa-moon";
        if (themeLabel) themeLabel.textContent = isDark ? "Switch to light mode" : "Switch to dark mode";
      }

      let saved = null;
      try { saved = localStorage.getItem("dg_theme") || localStorage.getItem("theme"); } catch (e) {}
      applyTheme(saved === "dark");

      if (themeBtn) {
        themeBtn.addEventListener("click", function () {
          const isDark = !document.body.classList.contains("dark-mode");
          applyTheme(isDark);
          // Saved under both names so the homepage and the story pages stay in step
          try {
            localStorage.setItem("dg_theme", isDark ? "dark" : "light");
            localStorage.setItem("theme", isDark ? "dark" : "light");
          } catch (e) {}
        });
      }
    })();

    // Dynamic Account Check
    async function updateHeaderAccount() {
      const accountBtn = document.getElementById("top-account-link");
      if (!accountBtn) return;

      try {
        const { data: { user } } = await supabaseClient.auth.getUser();

        if (user) {
          accountBtn.href = "profile.html";
          const { data: profile } = await supabaseClient
            .from("profiles")
            .select("full_name, avatar_url")
            .eq("id", user.id)
            .single();

          const displayName = profile?.full_name || user.user_metadata?.full_name || "My account";
          const avatarUrl = profile?.avatar_url;

          if (avatarUrl) {
            accountBtn.innerHTML = `
              <img src="${escapeHtml(avatarUrl)}" alt="" style="width:18px; height:18px; border-radius:50%; object-fit:cover; border:1px solid #bb1919;">
              <span>${escapeHtml(displayName)}</span>
            `;
          } else {
            accountBtn.innerHTML = "<span>" + escapeHtml(displayName) + "</span>";
          }
        } else {
          accountBtn.textContent = "Sign in";
          accountBtn.href = "profile.html";
        }
      } catch (e) {
        console.error("Auth check error:", e);
      }
    }

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.addEventListener("DOMContentLoaded", updateHeaderAccount);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
