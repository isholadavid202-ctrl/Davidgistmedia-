  <!-- BBC-style top bar (works together with bbc.css) -->
  <style>
    .masthead{padding-top:12px}
    .masthead .topbar{flex-direction:row;justify-content:space-between;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
    .topbar .brand-title{font-size:clamp(1.35rem,5.6vw,2rem);white-space:nowrap}
    .topbar .icons{display:flex;gap:4px;flex:0 0 80px}
    .topbar .acct{flex:0 0 80px;display:flex;justify-content:flex-end}
    .topbar button{width:36px;height:36px;display:grid;place-items:center;color:var(--ink)}
    .topbar svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .search-row.is-closed{display:none}
    .masthead .drawer{display:none;flex-direction:column;align-items:stretch;text-align:left;gap:0;padding:4px 0 8px}
    .masthead .drawer.open{display:flex}
    .drawer a{padding:13px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:.95rem}
    .drawer a:hover{color:var(--red)}
    @media(min-width:820px){
      .search-row.is-closed{display:flex}
      #search-btn{display:none}
    }
  </style>
</head>
<body>

  <!-- Splash screen (shows once per app session) -->
  <script src="js/splash.js"></script>

  <div class="util-bar">
    <div class="wrap">
      <span id="today"></span>
    </div>
  </div>

  <header class="masthead">
    <div class="wrap topbar">
      <div class="icons">
        <button type="button" id="menu-btn" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <button type="button" id="search-btn" aria-label="Search" aria-expanded="false">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        </button>
      </div>
      <a class="brand-title" href="/">David<span class="gold">gistmedia</span></a>
      <div class="acct"></div>
    </div>

    <div class="wrap drawer" id="drawer">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="editorial-policy.html">Editorial Policy</a>
      <a href="privacy-policy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="podcasts.html">Podcasts</a>
      <a href="live.html">Live</a>
      <a href="staff.html">Staff login</a>
      <a href="admin.html">Admin login</a>
    </div>

    <div class="wrap">
      <p class="tagline">Your Source for Entertainment &amp; Breaking News</p>
      <form class="search-row is-closed" id="search-form">
        <input type="text" id="search-input" placeholder="Search news...">
        <button type="submit">Search</button>
      </form>
    </div>

    <nav class="tabs" id="tabs">
      <button class="active" data-cat="all">Home</button>
      <button data-cat="nigeria">Nigeria</button>
      <button data-cat="politics">Politics</button>
      <button data-cat="entertainment">Entertainment</button>
      <button data-cat="sports">Sports</button>
      <button data-cat="business">Business</button>
      <button data-cat="technology">Technology</button>
      <button data-cat="world">World</button>
      <button data-cat="local">Local News</button>
      <a href="podcasts.html">Podcasts</a>
      <a href="live.html">Live</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero-section" id="hero-section"></section>

    <!-- Live broadcast card (filled in by js/live-banner.js, empty when nothing is live) -->
    <div id="live-banner"></div>

    <div id="trending-section"></div>

    <!-- Latest podcast episodes (filled in by js/podcast-home.js) -->
    <div id="podcast-home"></div>

    <div id="category-sections"></div>
  </main>

  <!-- Footer (built by js/footer.js). Keep these two lines ABOVE home.js. -->
  <div id="site-footer"></div>
  <script src="js/footer.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/live-banner.js?v=1"></script>
  <script src="js/home.js?v=6"></script>
  <script src="js/extras.js"></script>
  <script src="js/podcast-home.js"></script>
  <script>
    // Menu and search icons in the top bar
    (function () {
      var menuBtn = document.getElementById("menu-btn");
      var drawer = document.getElementById("drawer");
      var searchBtn = document.getElementById("search-btn");
      var form = document.getElementById("search-form");
      var input = document.getElementById("search-input");
      menuBtn.addEventListener("click", function () {
        var open = drawer.classList.toggle("open");
        menuBtn.setAttribute("aria-expanded", open);
      });
      searchBtn.addEventListener("click", function () {
        var closed = form.classList.toggle("is-closed");
        searchBtn.setAttribute("aria-expanded", !closed);
        if (!closed) input.focus();
      });
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>
</body>
</html>
