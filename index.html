      } catch (e) {}
    })();
  </script>

  <style>
    /* Night mode colors: headlines, lines, cards and muted text all use these */
    html[data-theme="dark"],
    body.dark-mode {
      --ink: #ececea;
      --paper: #1b1b1d;
      --page: #121213;
      --line: #2f2f31;
      --muted: #a3a3a0;
      --near-black: #0a0a0b;
      --red: #e8344c;
      color-scheme: dark;
    }
    html[data-theme="dark"] body,
    body.dark-mode {
      background-color: #121212 !important;
      color: #ffffff !important;
    }
    html[data-theme="dark"] .masthead,
    html[data-theme="dark"] .util-bar,
    body.dark-mode .masthead,
    body.dark-mode .util-bar {
      background-color: #1a1a1a !important;
      border-color: #333 !important;
    }
    html[data-theme="dark"] a,
    body.dark-mode a { color: #ffffff; }
    html[data-theme="dark"] .search-row input,
    body.dark-mode .search-row input {
      background: #242427;
      color: #ececea;
      border-color: #3a3a3d;
    }
    html[data-theme="dark"] .empty-state,
    body.dark-mode .empty-state {
      background: #18181a;
      border-color: #3a3a3d;
    }
    html[data-theme="dark"] .secondary-item > div[style],
    body.dark-mode .secondary-item > div[style] {
      background: #2a2a2d !important;
    }

    .util-bar .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-account-link {
      color: #bb1919;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .masthead { padding-top: 12px; }
    .masthead .topbar {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .topbar .brand-title {
      font-size: clamp(1.35rem, 5.6vw, 2rem);
      white-space: nowrap;
    }
    .topbar .icons {
      display: flex;
      gap: 4px;
      flex: 0 0 80px;
    }
    .topbar .acct {
      flex: 0 0 80px;
      display: flex;
      justify-content: flex-end;
    }
    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(128,128,128,0.3);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .theme-toggle-btn i {
      font-size: 0.95rem;
    }
    .topbar button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: var(--ink);
    }
    .topbar svg {
      width: 25px;
      height: 25px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .search-row.is-closed { display: none; }
    .masthead .drawer { display: none; flex-direction: column; align-items: stretch; text-align: left; gap: 0; padding: 4px 0 8px; }
    .masthead .drawer.open { display: flex; }
    .drawer a { padding: 13px 0; border-bottom: 1px solid var(--line); font-weight: 700; font-size: .95rem; }
    .drawer a:hover { color: var(--red); }
    @media(min-width: 820px) {
      .search-row.is-closed { display: flex; }
      #search-btn { display: none; }
    }

    /* Hidden on phones; the computer layout (desktop.css) shows them */
    .tabs-more { display: none; }
    .topic-strip { display: none; }

    /* Top advertisement strip: full width, above the header */
    .ad-top-bar {
      width: 100%;
      background: #f4f4f5;
      border-bottom: 1px solid #e2e2e4;
      padding: 8px 0 10px;
      text-align: center;
    }
    html[data-theme="dark"] .ad-top-bar,
    body.dark-mode .ad-top-bar {
      background: #1a1a1a;
      border-bottom-color: #2a2a2a;
    }
    .ad-top-bar .ad-label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .ad-top-bar .ad-box {
      display: flex;
      justify-content: center;
      overflow: hidden;
    }
    .ad-top-bar .ad-small { min-height: 50px; }
    .ad-top-bar .ad-wide { min-height: 90px; }

    /* Advertisement space inside the page: a small label above the banner */
    .ad-slot {
      margin: 20px 0;
      text-align: center;
    }
    .ad-slot .ad-label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .ad-slot .ad-box {
      display: flex;
      justify-content: center;
      overflow: hidden;
    }
    .ad-slot .ad-box.ad-tall { min-height: 250px; }

    /* The 320x50 banner is for phones, the 728x90 banner is for computers */
    .ad-mobile { display: block; }
    .ad-desktop { display: none; }
    @media(min-width: 768px) {
      .ad-mobile { display: none; }
      .ad-desktop { display: block; }
    }
  </style>

  <!-- NEW 1 of 3: homepage feed styles. Only affects .dg-feed and .dg-desk.
       Phones: top story = swipeable big card, Trending = big pictures, other stories = rows,
       with a big picture every 5th story.
       Computers (900px and wider): CNN style body. -->
  <style>
    .dg-feed { padding: 20px 0 0; }

    /* ---------- Top story: big card ---------- */
    .dg-card {
      position: relative;
      display: block;
      border-radius: 22px;
      overflow: hidden;
      aspect-ratio: 2 / 3;
      background: #1a1a1a;
      isolation: isolate;
      text-decoration: none;
      color: #fff !important;
    }
    .dg-card__img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .dg-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to top,
        rgba(0,0,0,.92) 0%,
        rgba(0,0,0,.70) 30%,
        rgba(0,0,0,0) 65%);
      pointer-events: none;
    }
    .dg-card__content {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 2;
      padding: 26px 24px 28px;
      pointer-events: none;
    }
    .dg-card__badge {
      display: inline-block;
      background: #c8102e;
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: .8px;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 5px;
      margin-bottom: 14px;
    }
    .dg-card__title {
      margin: 0 0 20px;
      color: #fff !important;
      font-weight: 800;
      font-size: clamp(26px, 7vw, 36px);
      line-height: 1.15;
    }
    .dg-card__meta {
      font-size: 15px;
      color: rgba(255,255,255,.8);
    }
    .dg-card__count {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,.8);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      pointer-events: none;
    }
    .dg-card__count svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* swipeable pictures inside the top card */
    .dg-slides {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .dg-slides::-webkit-scrollbar { display: none; }
    .dg-slides img {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      scroll-snap-align: start;
    }

    /* ---------- Section heading (Trending) ---------- */
    .dg-sec-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 26px 0 4px;
    }
    .dg-sec-head .dg-bar {
      width: 5px;
      height: 24px;
      background: #c8102e;
      border-radius: 2px;
    }
    .dg-sec-head h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: var(--ink, #111);
    }

    /* ---------- Big picture story: full-width image, headline below ---------- */
    .dg-big {
      display: block;
      padding: 18px 0;
      border-bottom: 1px solid var(--line, #e2e2e4);
      text-decoration: none;
    }
    .dg-big__img,
    .dg-big__ph {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-radius: 14px;
      background: var(--line, #e2e2e4);
    }
    .dg-big__title {
      margin: 14px 0 10px;
      font-size: clamp(24px, 6.4vw, 30px);
      font-weight: 800;
      line-height: 1.2;
      color: var(--ink, #111);
    }

    /* ---------- Other stories: thumbnail left, headline right ---------- */
    .dg-list { margin-top: 8px; }
    .dg-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line, #e2e2e4);
      text-decoration: none;
    }
    .dg-row__img,
    .dg-row__ph {
      flex: 0 0 36%;
      width: 36%;
      aspect-ratio: 4 / 3;
      border-radius: 6px;
      object-fit: cover;
      background: var(--line, #e2e2e4);
    }
    .dg-row__body { flex: 1; min-width: 0; }
    .dg-row__title {
      margin: 0 0 10px;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--ink, #111);
    }
    .dg-row__tag {
      display: inline-block;
      background: #c8102e;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .4px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: 2px;
    }
    .dg-row__meta {
      font-size: 13px;
      color: var(--muted, #6b6b6b);
    }

    /* comments never show on homepage stories */
    .dg-feed [class*="comment"] { display: none !important; }

    /* when the new feed is on, hide the old story lists (not the header or menu) */
    body.dg-on #hero-section,
    body.dg-on #trending-section,
    body.dg-on #category-sections { display: none !important; }

    /* ======================================================================
       COMPUTERS and "desktop site" view only (900px and wider): CNN style body.
       Phones never see this: .dg-desk is hidden below 900px.
       ====================================================================== */
    .dg-desk { display: none; }

    @media (min-width: 900px) {
      .dg-feed { display: none !important; }
      .dg-desk { display: block; padding-top: 22px; }
      .dg-desk a { text-decoration: none; color: var(--ink, #111); }
      .dg-desk h1, .dg-desk h2, .dg-desk h3 { margin: 0; }

      /* category page title (when a tab other than Home is chosen) */
      .dg-desk .dgd-pagehead {
        margin: 0 0 22px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line, #dcdcdc);
        font-size: 28px;
        font-weight: 800;
        text-transform: capitalize;
        color: var(--ink, #111);
      }

      /* ---------- section titles: black bar + capital letters ---------- */
      .dgd-head {
        display: flex;
        align-items: center;
        margin: 0 0 16px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .05em;
        text-transform: uppercase;
        color: var(--ink, #111);
      }
      .dgd-head::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 1.15em;
        margin-right: 9px;
        background: var(--ink, #111);
      }

      /* ---------- story blocks ---------- */
      .dgd-item { display: block; margin: 0 0 22px; }
      .dgd-ph { display: block; margin: 0 0 10px; }
      .dgd-ph img,
      .dgd-noimg {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        border-radius: 4px;
        background: var(--line, #dcdcdc);
      }
      .dgd-kick {
        display: block;
        margin: 0 0 4px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .05em;
        text-transform: uppercase;
        color: #c8102e;
      }
      .dgd-t {
        display: block;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.28;
        color: var(--ink, #111);
      }
      .dgd-meta {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted, #6b6b6b);
      }
      .dgd-item:hover .dgd-t,
      .dgd-row:hover .dgd-t,
      .dgd-text:hover,
      .dgd-mini a:hover span { text-decoration: underline; }

      /* headline only, with a thin line above */
      .dgd-text {
        display: block;
        padding: 12px 0;
        border-top: 1px solid var(--line, #dcdcdc);
        font-size: 15px;
        line-height: 1.4;
        color: var(--ink, #111);
      }

      /* small picture on the left, headline on the right */
      .dgd-row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 0;
        border-top: 1px solid var(--line, #dcdcdc);
      }
      .dgd-head + .dgd-row { border-top: 0; padding-top: 0; }
      .dgd-th { flex: 0 0 92px; }
      .dgd-th img,
      .dgd-th .dgd-noimg {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 3px;
        background: var(--line, #dcdcdc);
      }
      .dgd-row .dgd-t { font-size: 15px; font-weight: 600; line-height: 1.32; }
      .dgd-body { flex: 1; min-width: 0; }

      /* ---------- top: three columns ---------- */
      .dgd-top {
        display: grid;
        column-gap: 30px;
        align-items: start;
      }
      .dgd-col { min-width: 0; }

      /* middle: big headline above the picture */
      .dgd-lead { display: block; text-align: center; margin: 0 0 22px; }
      .dgd-lead h2 {
        margin: 0 0 18px;
        font-size: clamp(30px, 3vw, 44px);
        font-weight: 800;
        line-height: 1.1;
        color: var(--ink, #111);
      }
      .dgd-lead .dgd-ph { margin: 0; }
      .dgd-lead .dgd-ph img,
      .dgd-lead .dgd-noimg { aspect-ratio: 16 / 11; }
      .dgd-lead .dgd-by { margin-top: 10px; }
      .dgd-lead .dgd-deck + .dgd-by { margin-top: 0; }
      .dgd-deck {
        display: block;
        margin: 14px 0 4px;
        text-align: left;
        font-size: 17px;
        line-height: 1.45;
        color: var(--ink, #111);
      }
      .dgd-by {
        display: block;
        text-align: left;
        font-size: 12px;
        color: var(--muted, #6b6b6b);
      }
      .dgd-mini {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin: 18px 0 0;
        padding-top: 16px;
        border-top: 1px solid var(--line, #dcdcdc);
      }
      .dgd-mini a { display: block; }
      .dgd-mini img,
      .dgd-mini .dgd-noimg { aspect-ratio: 16 / 10; border-radius: 3px; margin-bottom: 8px; display: block; width: 100%; object-fit: cover; background: var(--line, #dcdcdc); }
      .dgd-mini span { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--ink, #111); }

      /* ---------- spotlight: big picture with words on it + small stories ---------- */
      .dgd-spot {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
        column-gap: 30px;
        align-items: start;
        margin-top: 44px;
      }
      .dgd-ovl {
        position: relative;
        display: block;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 6px;
        background: #111;
      }
      .dgd-ovl img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .dgd-ovl::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.55) 30%, rgba(0,0,0,0) 62%);
      }
      .dgd-cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 22px 26px 24px; }
      .dgd-cap, .dgd-cap * { color: #fff !important; }
      .dgd-badge {
        display: inline-block;
        margin: 0 0 10px;
        padding: 5px 10px;
        border-radius: 4px;
        background: #c8102e;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .dgd-cap h3 { font-size: 28px; font-weight: 800; line-height: 1.18; margin: 0 0 8px; }
      .dgd-cap .dgd-by { color: rgba(255,255,255,.8) !important; }

      /* ---------- category sections: three across ---------- */
      .dgd-band {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: 30px;
        row-gap: 10px;
        align-items: start;
        margin-top: 44px;
      }
      .dgd-sec { min-width: 0; }
      .dgd-spot > div + div .dgd-row:first-child { border-top: 0; padding-top: 0; }

      /* ---------- Top Picks: three tall cards ---------- */
      .dgd-picks { margin-top: 48px; }
      .dgd-picks h2 { margin: 0 0 16px; font-size: 26px; font-weight: 800; color: var(--ink, #111); }
      .dgd-picks__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
      .dgd-pick {
        position: relative;
        display: block;
        aspect-ratio: 3 / 4;
        overflow: hidden;
        border-radius: 8px;
        background: #111;
      }
      .dgd-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .dgd-pick::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,.55) 32%, rgba(0,0,0,0) 62%);
      }
      .dgd-pick .dgd-cap h3 { font-size: 21px; margin: 0; }

      /* ---------- everything else ---------- */
      .dgd-more { margin-top: 48px; }
      .dgd-more__list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: 30px;
      }
    }

    /* narrower computer screens */
    @media (min-width: 900px) and (max-width: 1199px) {
      .dgd-top, .dgd-spot, .dgd-band { column-gap: 20px; }
      .dgd-more__list { column-gap: 20px; }
      .dgd-lead h2 { font-size: 30px; }
      .dgd-t { font-size: 16px; }
      .dgd-cap h3 { font-size: 22px; }
      .dgd-th { flex-basis: 78px; }
    }
  </style>

<body>

  <!-- Splash screen -->
  <script src="js/splash.js?v=6"></script>

  <!-- Places the tabs and the Sign in link.
       Phones: tabs sit under the header and stay at the top while scrolling.
       Computers: tabs sit in the top row, with a "More" dropdown, and Sign in sits at the right. -->
  <script>
    (function () {
      var t = document.getElementById("tabs");
      var h = document.querySelector("header.masthead");
      if (!t || !h) return;
      var bar = h.querySelector(".topbar");
      var brand = bar.querySelector(".brand-title");
      var acct = bar.querySelector(".acct");
      var theme = document.getElementById("theme-toggle-btn");
      var link = document.getElementById("top-account-link");
      var utilWrap = document.querySelector(".util-bar .wrap");
      var mq = window.matchMedia("(min-width: 900px)");
      /* how many tabs stay in the row; the rest go under "More" */
      function keepCount() {
        var w = window.innerWidth;
        return w >= 1280 ? 8 : (w >= 1100 ? 5 : 4);
      }

      var all = [].slice.call(t.children);
      var more = document.createElement("div");
      more.className = "tabs-more";
      more.innerHTML = '<button type="button" class="more-btn" aria-expanded="false">More &#9662;</button><div class="more-panel"></div>';
      t.appendChild(more);
      var panel = more.querySelector(".more-panel");
      var btn = more.querySelector(".more-btn");

      function layout() {
        var desk = mq.matches;
        all.forEach(function (el, i) {
          if (desk && i >= keepCount()) panel.appendChild(el);
          else t.insertBefore(el, more);
        });
        if (desk) {
          brand.insertAdjacentElement("afterend", t);
          if (link) acct.insertBefore(link, theme);
        } else {
          h.insertAdjacentElement("afterend", t);
          if (link && utilWrap) utilWrap.appendChild(link);
        }
        more.classList.remove("open");
        btn.setAttribute("aria-expanded", "false");
      }

      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = more.classList.toggle("open");
        btn.setAttribute("aria-expanded", open);
      });
      panel.addEventListener("click", function () { more.classList.remove("open"); });
      document.addEventListener("click", function (e) {
        if (!more.contains(e.target)) {
          more.classList.remove("open");
          btn.setAttribute("aria-expanded", "false");
        }
      });

      layout();
      var lastW = window.innerWidth;
      window.addEventListener("resize", function () {
        if (window.innerWidth !== lastW) { lastW = window.innerWidth; layout(); }
      });
      if (mq.addEventListener) mq.addEventListener("change", layout);
      else if (mq.addListener) mq.addListener(layout);
    })();
  </script>

  <!-- NEW 3 of 3: draws the feed using your own home.js functions.
       Phones: swipeable top card, Trending, rows, a big picture every 5th story.
       Computers (900px and wider): CNN style body. No comments anywhere. -->
  <script>
    (function () {
      if (typeof renderPage !== "function") return;
      var base = renderPage;

      var camera = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>';

      function meta(a) {
        return '<div class="dg-row__meta">' + authorHtml(a.author) + " · " + formatWhen(a.published_at) + "</div>";
      }
      function link(a) {
        return 'href="article.html?slug=' + encodeURIComponent(a.slug) + '"';
      }

      /* the very first story: big card with text on the picture.
         With more than one picture, they can be swiped left and right. */
      function leadCard(a) {
        var pics = leadPictures(a);
        var multi = pics.length > 1;
        var media;
        if (multi) {
          media = '<div class="dg-slides">' + pics.map(function (u, i) {
            return '<img src="' + escapeHtml(getOptimizedImage(u, 800)) + '" alt="" draggable="false" ' +
                   (i === 0 ? 'fetchpriority="high"' : 'loading="lazy"') + ">";
          }).join("") + "</div>" +
          '<div class="dg-card__count" aria-hidden="true">' + camera + "<span>1</span>/" + pics.length + "</div>";
        } else {
          media = a.image_url
            ? '<img class="dg-card__img" src="' + escapeHtml(getOptimizedImage(a.image_url, 800)) + '" alt="" fetchpriority="high">'
            : "";
        }
        return '<a class="dg-card" ' + link(a) + ">" + media +
          '<div class="dg-card__content">' +
            '<span class="dg-card__badge">' + escapeHtml(a.category) + "</span>" +
            '<h2 class="dg-card__title">' + escapeHtml(a.title) + "</h2>" +
            '<div class="dg-card__meta">' + authorHtml(a.author) + " · " + formatWhen(a.published_at) + "</div>" +
          "</div></a>";
      }

      /* updates the "1/2" number while swiping */
      function wireSlides(box) {
        box.querySelectorAll(".dg-slides").forEach(function (slides) {
          var counter = slides.parentElement.querySelector(".dg-card__count span");
          if (!counter) return;
          slides.addEventListener("scroll", function () {
            var w = slides.clientWidth || 1;
            counter.textContent = String(Math.round(slides.scrollLeft / w) + 1);
          }, { passive: true });
        });
      }

      /* big picture story: full-width picture, headline below */
      function big(a) {
        return '<a class="dg-big" ' + link(a) + ">" +
          (a.image_url
            ? '<img class="dg-big__img" src="' + escapeHtml(getOptimizedImage(a.image_url, 800)) + '" alt="" loading="lazy">'
            : '<div class="dg-big__ph"></div>') +
          '<h3 class="dg-big__title"><span class="dg-row__tag">' + escapeHtml(a.category) + "</span>" + escapeHtml(a.title) + "</h3>" +
          meta(a) + "</a>";
      }

      /* small story: thumbnail left, headline right */
      function row(a) {
        return '<a class="dg-row" ' + link(a) + ">" +
          (a.image_url
            ? '<img class="dg-row__img" src="' + escapeHtml(getOptimizedImage(a.image_url, 400)) + '" alt="" loading="lazy">'
            : '<div class="dg-row__ph"></div>') +
          '<div class="dg-row__body">' +
            '<h3 class="dg-row__title"><span class="dg-row__tag">' + escapeHtml(a.category) + "</span>" + escapeHtml(a.title) + "</h3>" +
            meta(a) +
          "</div></a>";
      }

      /* ====================================================================
         COMPUTER VERSION (shown only on screens 900px and wider, see the CSS).
         CNN style: three columns on top, a spotlight story, category sections,
         Top Picks, then everything else.
         ==================================================================== */
      function dImg(a, w) {
        return a.image_url
          ? '<img src="' + escapeHtml(getOptimizedImage(a.image_url, w)) + '" alt="" loading="lazy">'
          : '<span class="dgd-noimg"></span>';
      }
      function ago(a) { return timeAgo(a.published_at); }

      /* picture, small red label, headline, time */
      function dPic(a) {
        return '<a class="dgd-item" ' + link(a) + '>' +
          '<span class="dgd-ph">' + dImg(a, 600) + '</span>' +
          '<span class="dgd-kick">' + escapeHtml(a.category) + '</span>' +
          '<h3 class="dgd-t">' + escapeHtml(a.title) + '</h3>' +
          '<span class="dgd-meta">' + ago(a) + '</span></a>';
      }
      /* headline only */
      function dText(a) {
        return '<a class="dgd-text" ' + link(a) + '>' + escapeHtml(a.title) + '</a>';
      }
      /* small picture left, headline right */
      function dRow(a) {
        return '<a class="dgd-row" ' + link(a) + '>' +
          '<span class="dgd-th">' + dImg(a, 300) + '</span>' +
          '<span class="dgd-body"><h3 class="dgd-t">' + escapeHtml(a.title) + '</h3>' +
          '<span class="dgd-meta">' + ago(a) + '</span></span></a>';
      }
      /* three small pictures in a row */
      function dMini(list) {
        return '<div class="dgd-mini">' + list.map(function (a) {
          return '<a ' + link(a) + '>' + dImg(a, 300) + '<span>' + escapeHtml(a.title) + '</span></a>';
        }).join("") + '</div>';
      }
      /* picture with the words on it */
      function dOverlay(a) {
        return '<a class="dgd-ovl" ' + link(a) + '>' +
          (a.image_url ? '<img src="' + escapeHtml(getOptimizedImage(a.image_url, 1000)) + '" alt="" loading="lazy">' : '') +
          '<div class="dgd-cap"><span class="dgd-badge">' + escapeHtml(a.category) + '</span>' +
          '<h3>' + escapeHtml(a.title) + '</h3>' +
          '<span class="dgd-by">' + authorHtml(a.author) + ' · ' + formatWhen(a.published_at) + '</span></div></a>';
      }
      /* tall card */
      function dPick(a) {
        return '<a class="dgd-pick" ' + link(a) + '>' +
          (a.image_url ? '<img src="' + escapeHtml(getOptimizedImage(a.image_url, 700)) + '" alt="" loading="lazy">' : '') +
          '<div class="dgd-cap"><span class="dgd-badge">' + escapeHtml(a.category) + '</span>' +
          '<h3>' + escapeHtml(a.title) + '</h3></div></a>';
      }
      function dSection(c, items) {
        return '<section class="dgd-sec"><div class="dgd-head">' + escapeHtml(c) + '</div>' +
          dPic(items[0]) + items.slice(1).map(dRow).join("") + '</section>';
      }
      function chunk(arr, n) {
        var out = [];
        for (var i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
        return out;
      }

      function deskFeed(list, lead, isHome, catName) {
        var pool = list.filter(function (a) { return a.id !== lead.id; });
        function take(n) { return pool.splice(0, n); }

        /* Trending = most liked stories */
        var trend = pool
          .filter(function (a) { return (a.likes || 0) > 0; })
          .sort(function (a, b) { return (b.likes || 0) - (a.likes || 0); })
          .slice(0, 4);
        pool = pool.filter(function (a) { return trend.indexOf(a) === -1; });

        var leftPics = take(3), leftText = take(2);
        var midText = take(3), midMini = take(3);
        var rightFeature = take(1);
        var rightRows = trend.length ? trend : take(4);

        /* left column */
        var left = leftPics.map(dPic).join("") + leftText.map(dText).join("");

        /* middle column */
        var mid = '<a class="dgd-lead" ' + link(lead) + '>' +
          '<h2>' + escapeHtml(lead.title) + '</h2>' +
          '<span class="dgd-ph">' + dImg(lead, 1000) + '</span>' +
          (lead.excerpt ? '<span class="dgd-deck">' + escapeHtml(lead.excerpt) + '</span>' : '') +
          '<span class="dgd-by">' + authorHtml(lead.author) + ' · ' + formatWhen(lead.published_at) + '</span></a>' +
          midText.map(dText).join("") +
          (midMini.length ? dMini(midMini) : "");

        /* right column */
        var right = rightFeature.map(dPic).join("");
        if (rightRows.length) {
          right += '<div class="dgd-head" style="margin-top:6px">' + (trend.length ? "Trending" : "Latest") + '</div>' +
                   rightRows.map(dRow).join("");
        }

        /* only keep the columns that have something in them */
        var cols = [], widths = [];
        if (left) { cols.push(left); widths.push("minmax(0,1fr)"); }
        cols.push(mid); widths.push("minmax(0,2.1fr)");
        if (right) { cols.push(right); widths.push("minmax(0,1fr)"); }
        var html = (catName ? '<h1 class="dgd-pagehead">' + escapeHtml(catName) + '</h1>' : "") +
          '<div class="dgd-top" style="grid-template-columns:' + widths.join(" ") + '">' +
          cols.map(function (c) { return '<div class="dgd-col">' + c + '</div>'; }).join("") + '</div>';

        if (isHome) {
          /* spotlight: big picture + small stories */
          if (pool.length >= 3) {
            var spot = take(1)[0], side = take(Math.min(4, pool.length));
            html += '<div class="dgd-spot"><div>' + dOverlay(spot) + '</div><div>' + side.map(dRow).join("") + '</div></div>';
          }

          /* Top Picks: three tall cards (chosen before the category sections use up the stories) */
          var picks = take(3);

          /* category sections: one story with a picture, then up to two small ones */
          var order = [], groups = {};
          pool.forEach(function (a) {
            var c = a.category || "news";
            if (!groups[c]) { groups[c] = []; order.push(c); }
            groups[c].push(a);
          });
          var sections = order.slice(0, 12).map(function (c) {
            var items = groups[c].slice(0, 3);
            pool = pool.filter(function (a) { return items.indexOf(a) === -1; });
            return { c: c, items: items };
          });
          var bands = chunk(sections, 3);
          bands.forEach(function (band, i) {
            html += '<div class="dgd-band">' + band.map(function (s) { return dSection(s.c, s.items); }).join("") + '</div>';
            if (i === 0 && picks.length === 3) {
              html += '<section class="dgd-picks"><h2>Top Picks</h2><div class="dgd-picks__grid">' + picks.map(dPick).join("") + '</div></section>';
              picks = [];
            }
          });
          if (picks.length === 3) {
            html += '<section class="dgd-picks"><h2>Top Picks</h2><div class="dgd-picks__grid">' + picks.map(dPick).join("") + '</div></section>';
          } else if (picks.length) {
            pool = picks.concat(pool);
          }
        }

        /* everything left over */
        if (pool.length) {
          html += '<section class="dgd-more"><div class="dgd-head">' + (isHome ? "More stories" : "More " + escapeHtml(catName || "stories")) + '</div>' +
                  '<div class="dgd-more__list">' + pool.map(dRow).join("") + '</div></section>';
        }
        return html;
      }

      function feed() {
        var box = document.getElementById("dg-feed");
        if (!box) return;

        var list = (typeof getFiltered === "function") ? getFiltered() : [];
        var desk = document.getElementById("dg-desk");
        if (!list.length) {
          document.body.classList.remove("dg-on");
          box.innerHTML = "";
          if (desk) desk.innerHTML = "";
          return;
        }

        var lead = list.find(function (a) { return a.featured; }) || list[0];

        /* Trending: the most liked stories, shown as big pictures */
        var trending = list
          .filter(function (a) { return a.id !== lead.id && (a.likes || 0) > 0; })
          .sort(function (a, b) { return (b.likes || 0) - (a.likes || 0); })
          .slice(0, 3);
        var used = {};
        used[lead.id] = true;
        trending.forEach(function (a) { used[a.id] = true; });

        /* every other story on the homepage; every 5th one is a big picture */
        var rest = list.filter(function (a) { return !used[a.id]; });

        var html = leadCard(lead);
        if (trending.length) {
          html += '<section class="dg-trend"><div class="dg-sec-head"><span class="dg-bar"></span><h2>Trending</h2></div>' +
                  '<div class="dg-trend__grid">' + trending.map(big).join("") + "</div></section>";
        }
        if (rest.length) {
          html += '<div class="dg-list">' +
                  rest.map(function (a, i) { return (i % 5 === 4) ? big(a) : row(a); }).join("") +
                  "</div>";
        }

        box.innerHTML = html;
        wireSlides(box);

        /* computer version */
        if (desk) {
          var cat = (typeof activeCategory !== "undefined") ? activeCategory : "all";
          var isHome = (cat === "all") && !((typeof searchQuery !== "undefined") && String(searchQuery).trim());
          desk.innerHTML = deskFeed(list, lead, isHome, isHome ? "" : (cat !== "all" ? cat : "Search results"));
        }
        document.body.classList.add("dg-on");
      }

      renderPage = function () { base(); feed(); };
      if (typeof allArticles !== "undefined" && allArticles.length) feed();
    })();
  </script>

  <script>
    (function () {
      var menuBtn = document.getElementById("menu-btn");
      var drawer = document.getElementById("drawer");
      var searchBtn = document.getElementById("search-btn");
      var form = document.getElementById("search-form");
      var input = document.getElementById("search-input");
      if (menuBtn && drawer) {
        menuBtn.addEventListener("click", function () {
          var open = drawer.classList.toggle("open");
          menuBtn.setAttribute("aria-expanded", open);
        });
      }
      if (searchBtn && form) {
        searchBtn.addEventListener("click", function () {
          var closed = form.classList.toggle("is-closed");
          searchBtn.setAttribute("aria-expanded", !closed);
          if (!closed && input) input.focus();
        });
      }
    })();

    // Night Mode Toggle Functionality
    (function () {
      const themeBtn = document.getElementById("theme-toggle-btn");
      const themeIcon = document.getElementById("theme-icon");

      function applyTheme(isDark) {
        document.body.classList.toggle("dark-mode", isDark);
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        if (themeIcon) themeIcon.className = isDark ? "fa-solid fa-sun" : "fa-regular fa-moon";
      }

      let saved = null;
      try { saved = localStorage.getItem("dg_theme") || localStorage.getItem("theme"); } catch (e) {}
      applyTheme(saved === "dark");

      if (themeBtn) {
        themeBtn.addEventListener("click", function () {
          const isDark = !document.body.classList.contains("dark-mode");
          applyTheme(isDark);
          // Saved under both names so the homepage and the story pages stay in step
          try {
            localStorage.setItem("dg_theme", isDark ? "dark" : "light");
            localStorage.setItem("theme", isDark ? "dark" : "light");
          } catch (e) {}
        });
      }
    })();

    // Dynamic Account Check
    async function updateHeaderAccount() {
      const accountBtn = document.getElementById("top-account-link");
      if (!accountBtn) return;

      try {
        const { data: { user } } = await supabaseClient.auth.getUser();

        if (user) {
          accountBtn.href = "profile.html";
          const { data: profile } = await supabaseClient
            .from("profiles")
            .select("full_name, avatar_url")
            .eq("id", user.id)
            .single();

          const displayName = profile?.full_name || user.user_metadata?.full_name || "My account";
          const avatarUrl = profile?.avatar_url;

          if (avatarUrl) {
            accountBtn.innerHTML = `
              <img src="${escapeHtml(avatarUrl)}" alt="" style="width:18px; height:18px; border-radius:50%; object-fit:cover; border:1px solid #bb1919;">
              <span>${escapeHtml(displayName)}</span>
            `;
          } else {
            accountBtn.textContent = displayName;
          }
        } else {
          accountBtn.textContent = "Sign in";
          accountBtn.href = "profile.html";
        }
      } catch (e) {
        console.error("Auth check error:", e);
      }
    }

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.addEventListener("DOMContentLoaded", updateHeaderAccount);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>
</body>
