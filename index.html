  <!-- Header Layout & Topbar Styles -->
  <style>
    .masthead { padding-top: 12px; }
    .masthead .topbar {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .topbar .brand-title {

      white-space: nowrap;
    }
    .topbar .icons {
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
    }
    .topbar .acct {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .topbar button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: var(--ink);
    }
    .topbar svg {
      width: 25px;
      height: 25px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .header-account-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(128, 128, 128, 0.15);
      white-space: nowrap;
    }
    .header-account-btn:hover {
      background: rgba(128, 128, 128, 0.25);
    }
    .search-row.is-closed { display: none; }
    .masthead .drawer { display: none; flex-direction: column; align-items: stretch; text-align: left; gap: 0; padding: 4px 0 8px; }
    .masthead .drawer.open { display: flex; }
    .drawer a { padding: 13px 0; border-bottom: 1px solid var(--line); font-weight: 700; font-size: .95rem; }
    .drawer a:hover { color: var(--red); }
    @media(min-width: 820px) {
      .search-row.is-closed { display: flex; }
      #search-btn { display: none; }
    }
  </style>

  <script>
    (function () {
      var menuBtn = document.getElementById("menu-btn");
      var drawer = document.getElementById("drawer");
      var searchBtn = document.getElementById("search-btn");
      var form = document.getElementById("search-form");
      var input = document.getElementById("search-input");
      if (menuBtn && drawer) {
        menuBtn.addEventListener("click", function () {
          var open = drawer.classList.toggle("open");
          menuBtn.setAttribute("aria-expanded", open);
        });
      }
      if (searchBtn && form) {
        searchBtn.addEventListener("click", function () {
          var closed = form.classList.toggle("is-closed");
          searchBtn.setAttribute("aria-expanded", !closed);
          if (!closed && input) input.focus();
        });
      }
    })();

    async function updateHeaderAccount() {
      const accountBtn = document.getElementById("header-account-link");
      if (!accountBtn) return;

      try {
        const { data: { user } } = await supabaseClient.auth.getUser();

        if (user) {
          const { data: profile } = await supabaseClient
            .from("profiles")
            .select("full_name, avatar_url")
            .eq("id", user.id)
            .single();

          const displayName = profile?.full_name || user.user_metadata?.full_name || "My account";
          const avatarUrl = profile?.avatar_url;

          if (avatarUrl) {
            accountBtn.innerHTML = `
              <img src="${escapeHtml(avatarUrl)}" alt="" style="width:22px; height:22px; border-radius:50%; object-fit:cover; border:1px solid var(--red);">
              <span>${escapeHtml(displayName)}</span>
            `;
          } else {
            accountBtn.textContent = displayName;
          }
          accountBtn.href = "profile.html";
        } else {
          accountBtn.textContent = "My account";
          accountBtn.href = "profile.html";
        }
      } catch (e) {
        console.error("Auth check error:", e);
      }
    }

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.addEventListener("DOMContentLoaded", updateHeaderAccount);
  </script>

  <script>
