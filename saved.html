<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Saved stories | Davidgistmedia</title>
  <meta name="description" content="Stories you saved on this device to read later.">
  <meta name="robots" content="noindex">
  <style>
    :root{--bg:#fff;--ink:#141414;--muted:#6b6b6b;--line:#e6e6e6;--card:#f4f4f4;--red:#c8102e;--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    html[data-theme="dark"]{--bg:#0f0f10;--ink:#f1f1f1;--muted:#a6a6a6;--line:#2a2a2a;--card:#1a1a1b}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
    a{color:inherit;text-decoration:none}
    .sp-top{background:#fff;color:#141414;border-bottom:1px solid #ececec}
    html[data-theme="dark"] .sp-top{background:#111;color:#f2f2f2;border-color:#262626}
    .sp-top .in{max-width:1100px;margin:0 auto;padding:0 16px;min-height:56px;display:flex;align-items:center;justify-content:center}
    .sp-brand{display:inline-flex}
    main{max-width:820px;margin:0 auto;padding:24px 16px 40px}
    h1{font-size:1.7rem;font-weight:800;margin:0 0 4px}
    .sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
    .row{position:relative;display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
    .row .th{flex:0 0 34%;max-width:200px}
    .row img,.row .no{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;background:var(--card)}
    .row .t{font-size:1.05rem;font-weight:700;line-height:1.28;margin:0 0 6px}
    .row small{color:var(--muted)}
    .row .rm{margin-top:8px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font:700 .78rem var(--font);cursor:pointer}
    .row .rm:hover{color:var(--red);border-color:var(--red)}
    .empty{text-align:center;padding:56px 12px;color:var(--muted)}
    .empty svg{width:48px;height:48px;fill:none;stroke:var(--red);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px}
    .empty b{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:6px}
    .empty a{display:inline-block;margin-top:16px;background:var(--red);color:#fff;font-weight:800;padding:11px 20px;border-radius:999px}
  </style>
  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
  <div class="sp-top"><div class="in"><a class="sp-brand" href="index.html">Davidgistmedia</a></div></div>
  <main>
    <h1>Saved</h1>
    <p class="sub" id="sub">Stories you saved on this phone to read later.</p>
    <div id="list"></div>
  </main>
  <script src="mini-player.js?v=1"></script>
  <script src="brand.js?v=1"></script>
  <script>
    (function () {
      function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
      function ago(t) { var m = Math.max(1, Math.round((Date.now() - t) / 60000)); if (m < 60) return m + " min ago"; var h = Math.round(m / 60); if (h < 24) return h + " hrs ago"; var d = Math.round(h / 24); return d + (d === 1 ? " day ago" : " days ago"); }
      function draw() {
        var a = DGSave.list(), box = document.getElementById("list");
        document.getElementById("sub").textContent = a.length ? a.length + (a.length === 1 ? " story" : " stories") + " saved on this device" : "Stories you saved on this phone to read later.";
        if (!a.length) {
          box.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><b>Nothing saved yet</b>Tap the bookmark on any story to keep it here.<br><a href="index.html">Browse the news</a></div>';
          return;
        }
        box.innerHTML = a.map(function (x) {
          return '<div class="row"><a class="th" href="article.html?slug=' + encodeURIComponent(x.slug) + '">' + (x.img ? '<img src="' + esc(x.img) + '" alt="" loading="lazy">' : '<span class="no"></span>') + '</a>' +
            '<div><a href="article.html?slug=' + encodeURIComponent(x.slug) + '"><h2 class="t">' + esc(x.title) + '</h2></a><small>Saved ' + ago(x.t) + '</small><br><button class="rm" data-s="' + esc(x.slug) + '">Remove</button></div></div>';
        }).join("");
      }
      document.getElementById("list").addEventListener("click", function (e) {
        var b = e.target.closest(".rm"); if (!b) return; DGSave.remove(b.getAttribute("data-s")); draw();
      });
      window.addEventListener("load", draw); if (document.readyState === "complete") draw();
    })();
  </script>
</body>
</html>
