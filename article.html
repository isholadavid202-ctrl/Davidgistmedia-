  <!-- TEMPORARY DEBUG: shows a red bar at the bottom if a script fails. Delete this block when done. -->
  <script>
  (function(){
    function show(t){
      var d=document.createElement("div");
      d.style.cssText="position:fixed;left:0;right:0;bottom:0;background:#b00020;color:#fff;padding:10px;font:12px monospace;z-index:99999;word-break:break-all";
      d.textContent=t;
      document.body.appendChild(d);
    }
    function ignore(s){return /googlesyndication|googletagmanager|google-analytics|doubleclick/i.test(s||"");}
    window.addEventListener("error",function(e){
      if(e.target&&e.target.src){
        if(ignore(e.target.src))return;
        show("FAILED TO LOAD: "+e.target.src);
      }else{
        show("ERROR: "+e.message+" ("+String(e.filename||"").split("/").pop()+":"+e.lineno+")");
      }
    },true);
    window.addEventListener("unhandledrejection",function(e){
      show("PROMISE ERROR: "+(e.reason&&e.reason.message||e.reason));
    });
  })();
  </script>

  <!-- Menu and today's date -->
  <script>
    (function () {
      var menuBtn = document.getElementById("menu-btn");
      var drawer = document.getElementById("drawer");
      menuBtn.addEventListener("click", function () {
        var open = drawer.classList.toggle("open");
        menuBtn.setAttribute("aria-expanded", open);
      });
      var today = document.getElementById("today");
      if (today) today.textContent = new Date().toLocaleDateString("en-NG", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
    })();
  </script>
