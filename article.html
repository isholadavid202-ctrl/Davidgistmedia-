  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script src="js/supabase-client.js"></script>

  <script src="/js/install-banner.js?v=1"></script>

  <script>
    (function () {
      var menuBtn = document.getElementById("menu-btn");
      var drawer = document.getElementById("drawer");
      if (menuBtn && drawer) {
        menuBtn.addEventListener("click", function () {
          var open = drawer.classList.toggle("open");
          menuBtn.setAttribute("aria-expanded", open);
        });
      }
      var today = document.getElementById("today");
      if (today) today.textContent = new Date().toLocaleDateString("en-NG", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
    })();

    async function updateHeaderAccount() {
      const accountBtn = document.getElementById("header-account-link");
      if (!accountBtn) return;

      try {
        const { data: { user } } = await supabaseClient.auth.getUser();

        if (user) {
          const { data: profile } = await supabaseClient
            .from("profiles")
            .select("full_name, avatar_url")
            .eq("id", user.id)
            .single();

          const displayName = profile?.full_name || user.user_metadata?.full_name || "My account";
          const avatarUrl = profile?.avatar_url;

          if (avatarUrl) {
            accountBtn.innerHTML = `
              <img src="${escapeHtml(avatarUrl)}" alt="" style="width:22px; height:22px; border-radius:50%; object-fit:cover; border:1px solid var(--red);">
              <span>${escapeHtml(displayName)}</span>
            `;
          } else {
            accountBtn.textContent = displayName;
          }
          accountBtn.href = "profile.html";
        } else {
          accountBtn.textContent = "My account";
          accountBtn.href = "profile.html";
        }
      } catch (e) {
        console.error("Auth check error:", e);
      }
    }

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.addEventListener("DOMContentLoaded", updateHeaderAccount);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js", { updateViaCache: "none" })
          .then(function (reg) { reg.update(); })
          .catch(function () {});
      });
    }
  </script>
</body>
