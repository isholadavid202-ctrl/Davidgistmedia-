<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try { var t = localStorage.getItem("dg_theme") || localStorage.getItem("theme"); if (t === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
    })();
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6QHB1S6KFV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-6QHB1S6KFV");
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Listen to this Davidgistmedia podcast episode.">
  <meta name="theme-color" content="#0d0d0d">
  <title id="page-title">Podcast | Davidgistmedia</title>
  <link rel="stylesheet" href="styles.css?v=3">
  <link rel="stylesheet" href="bbc.css?v=13">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">

     crossorigin="anonymous"></script>

  <style>
    /* ---------- Header (same as the homepage) ---------- */
    :root{--h-bg:#ffffff;--h-ink:#141414;--h-muted:#666666;--h-line:#e3e3e3;--h-card:#f4f4f4;--h-red:#c8102e}
    html[data-theme="dark"]{--h-bg:#101010;--h-ink:#f0f0f0;--h-muted:#a6a6a2;--h-line:#2b2b2b;--h-card:#1b1b1b}
    .sp-util{background:var(--h-card);border-bottom:1px solid var(--h-line)}
    .sp-util .hd-in{max-width:1400px;margin:0 auto;padding:7px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--h-muted)}
    .sp-account{color:var(--h-ink);font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:65%;white-space:nowrap;padding:6px 0;text-decoration:none}
    .sp-account span{overflow:hidden;text-overflow:ellipsis}
    .sp-account img{flex:0 0 auto}
    .sp-top{background:#111;color:#fff}
    .sp-top .hd-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:6px}
    .sp-brand{margin-left:6px;font:700 1.5rem Georgia,"Times New Roman",serif;color:#fff;white-space:nowrap;text-decoration:none}
    .sp-brand span{color:#e8344c}
    .sp-spacer{flex:1}
    .sp-btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
    #menu-btn,#search-btn{border:0;width:36px;height:36px}
    .sp-drawer{background:#111;border-top:1px solid #2b2b2b}
    .sp-drawer .hd-in{max-width:1400px;margin:0 auto;padding:4px 20px 10px;display:flex;flex-direction:column}
    .sp-drawer a{padding:12px 0;border-bottom:1px solid #2b2b2b;color:#e6e6e6;font-weight:700;font-size:.95rem;text-decoration:none}
    .sp-drawer a:hover{color:#fff}
    .sp-search{background:var(--h-card);border-bottom:1px solid var(--h-line)}
    .sp-search form{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;gap:8px}
    .sp-search input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--h-line);border-radius:8px;background:var(--h-bg);color:var(--h-ink);font-size:1rem;font-family:inherit}
    .sp-search button{padding:11px 18px;border:0;border-radius:8px;background:var(--h-red);color:#fff;font-weight:800;cursor:pointer;font-family:inherit}
    .sp-drawer[hidden],.sp-search[hidden]{display:none !important}
    .sp-nav{position:sticky;top:0;z-index:30;background:var(--h-bg);border-bottom:1px solid var(--h-line)}
    .sp-nav .hd-in{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;overflow-x:auto;scrollbar-width:none}
    .sp-nav .hd-in::-webkit-scrollbar{display:none}
    .sp-nav a{flex:0 0 auto;padding:15px 15px 12px;font-weight:700;font-size:.95rem;color:var(--h-muted);border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none}
    .sp-nav a:hover{color:var(--h-ink)}
    .sp-nav a.on{color:var(--h-ink);border-bottom-color:var(--h-red)}
    @media (max-width:520px){
      .sp-top .hd-in{padding:10px 14px}
      .sp-brand{font-size:1.15rem}
      .sp-util .hd-in{padding:7px 14px}
      .sp-nav .hd-in{padding:0 8px}
    }
    @media (max-width:360px){
      .sp-brand{font-size:1.02rem}
      .sp-btn{width:30px;height:30px}
    }

    /* Night mode for the page itself */
    html[data-theme="dark"],body.dark-mode{--ink:#ececea;--paper:#1b1b1d;--page:#121213;--line:#2f2f31;--muted:#a3a3a0;--near-black:#0a0a0b;--red:#e8344c;color-scheme:dark}
    html[data-theme="dark"] body,body.dark-mode{background-color:#0d0d0d !important;color:#f0f0f0 !important}
    html[data-theme="dark"] .comment-form input,html[data-theme="dark"] .comment-form textarea{background:#242427;color:#ececea;border-color:#3a3a3d}
    html[data-theme="dark"] .empty-state{background:#18181a;border-color:#3a3a3d}
    html[data-theme="dark"] .engage-btn{color:#d6d6d3}

    .ep-cover{width:100%;max-width:420px;aspect-ratio:1/1;object-fit:cover;display:block;margin:0 0 18px;background:var(--line)}
    .ep-cover.ph{display:grid;place-items:center;color:var(--muted);font-size:3rem}
    .ep-stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.9rem;margin:0 0 14px}
    .ep-stats i{margin-right:6px}
    .ep-player{width:100%;margin:0 0 6px}
    .ep-desc{white-space:pre-line}
  </style>
</head>
<body>

  <div class="sp-util">
    <div class="hd-in">
      <span id="today"></span>
      <a class="sp-account" href="profile.html" id="top-account-link">Sign in</a>
    </div>
  </div>

  <div class="sp-top">
    <div class="hd-in">
      <button type="button" class="sp-btn" id="menu-btn" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button type="button" class="sp-btn" id="search-btn" aria-label="Search" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <a class="sp-brand" href="/">David<span>gistmedia</span></a>
      <span class="sp-spacer"></span>
      <button type="button" class="sp-btn" id="theme-toggle-btn" aria-label="Switch between light and dark"><span id="theme-icon" style="display:grid;place-items:center"></span></button>
    </div>
  </div>

  <div class="sp-drawer" id="drawer" hidden>
    <div class="hd-in">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="editorial-policy.html">Editorial Policy</a>
      <a href="privacy-policy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="podcasts.html">Podcasts</a>
      <a href="live.html">Live</a>
      <a href="videos.html">Videos</a>
      <a href="staff.html">Staff login</a>
      <a href="admin.html">Admin login</a>
    </div>
  </div>

  <div class="sp-search" id="search-bar" hidden>
    <form id="search-form">
      <input type="text" id="search-input" placeholder="Search news..." aria-label="Search news">
      <button type="submit">Search</button>
    </form>
  </div>

  <nav class="sp-nav" aria-label="Main navigation">
    <div class="hd-in">
      <a href="index.html">Home</a>
      <a href="podcasts.html" class="on">Podcasts</a>
      <a href="live.html">Live</a>
      <a href="videos.html">Videos</a>
    </div>
  </nav>

  <main class="wrap article-page" id="ep-root">
    <div class="empty-state">Loading episode…</div>
  </main>

  <div id="site-footer"></div>
  <script src="js/footer.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/extras.js"></script>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      $("menu-btn").addEventListener("click", function () {
        var d = $("drawer"); d.hidden = !d.hidden;
        this.setAttribute("aria-expanded", String(!d.hidden));
      });
      $("search-btn").addEventListener("click", function () {
        var b = $("search-bar"); b.hidden = !b.hidden;
        this.setAttribute("aria-expanded", String(!b.hidden));
        if (!b.hidden) $("search-input").focus();
      });
      $("search-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var q = $("search-input").value.trim();
        if (q) location.href = "index.html?q=" + encodeURIComponent(q);
      });
      var today = $("today");
      if (today) {
        var shortDate = window.innerWidth < 600;
        today.textContent = new Date().toLocaleDateString("en-NG", shortDate
          ? { weekday: "short", day: "numeric", month: "short", year: "numeric" }
          : { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      }
      var themeIcon = $("theme-icon");
      var MOON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      var SUN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      function applyTheme(dark) {
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.body.classList.toggle("dark-mode", dark);
        themeIcon.innerHTML = dark ? SUN : MOON;
      }
      var saved = null;
      try { saved = localStorage.getItem("dg_theme") || localStorage.getItem("theme"); } catch (e) {}
      applyTheme(saved === "dark");
      $("theme-toggle-btn").addEventListener("click", function () {
        var dark = document.documentElement.getAttribute("data-theme") !== "dark";
        applyTheme(dark);
        try { localStorage.setItem("dg_theme", dark ? "dark" : "light"); localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      });
    })();

    function dgHeadEsc(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    /* shows the member's name and picture instead of "Sign in" when logged in */
    async function updateHeaderAccount() {
      const accountBtn = document.getElementById("top-account-link");
      if (!accountBtn || typeof supabaseClient === "undefined") return;
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          accountBtn.href = "profile.html";
          const { data: profile } = await supabaseClient.from("profiles").select("full_name, avatar_url").eq("id", user.id).single();
          const displayName = (profile && profile.full_name) || (user.user_metadata && user.user_metadata.full_name) || "My account";
          const avatarUrl = profile && profile.avatar_url;
          if (avatarUrl) {
            accountBtn.innerHTML = '<img src="' + dgHeadEsc(avatarUrl) + '" alt="" style="width:18px;height:18px;border-radius:50%;object-fit:cover;border:1px solid #e8344c;"><span>' + dgHeadEsc(displayName) + '</span>';
          } else {
            accountBtn.innerHTML = "<span>" + dgHeadEsc(displayName) + "</span>";
          }
        } else {
          accountBtn.textContent = "Sign in";
          accountBtn.href = "profile.html";
        }
      } catch (e) { console.error("Auth check error:", e); }
    }
    document.addEventListener("DOMContentLoaded", updateHeaderAccount);
  </script>

  <script>
    (function () {
      var root = document.getElementById("ep-root");
      var id = new URLSearchParams(location.search).get("id");
      var ep = null, likeBusy = false;

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function day(d) {
        var t = new Date(d);
        if (isNaN(t.getTime())) return "";
        return t.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "Africa/Lagos" });
      }
      function when(d) {
        var t = new Date(d);
        if (isNaN(t.getTime())) return "";
        var clock = t.toLocaleTimeString("en-GB", { hour: "numeric", minute: "2-digit", hour12: true, timeZone: "Africa/Lagos" })
          .replace(/am|pm/i, function (m) { return m.toUpperCase(); });
        return day(d) + ", " + clock;
      }
      function list(key) { try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { return []; } }
      function save(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {} }
      function fail(msg) {
        root.innerHTML = '<a class="back-link" href="podcasts.html">← All podcasts</a><div class="empty-state">' + msg + '</div>';
      }

      async function load() {
        if (!id) { fail("No episode selected."); return; }
        try {
          var res = await supabaseClient.from("podcasts").select("*").eq("id", id).maybeSingle();
          if (res.error) throw res.error;
          ep = res.data;
          if (!ep) { fail("Sorry, we couldn't find that episode."); return; }
        } catch (e) { fail("Couldn't load this episode right now."); return; }

        document.getElementById("page-title").textContent = ep.title + " | Davidgistmedia Podcasts";
        var liked = list("dg_pod_liked").indexOf(ep.id) > -1;

        root.innerHTML =
          '<a class="back-link" href="podcasts.html">← All podcasts</a>' +
          '<div class="cat">Podcast</div>' +
          '<h1>' + esc(ep.title) + '</h1>' +
          '<div class="meta byline"><div class="byline-author">' + esc(ep.host || "Davidgistmedia") + '</div>' +
            '<div class="byline-info"><span>' + day(ep.published_at) + '</span>' +
            (ep.duration ? '<span class="by-bar"></span><span>' + esc(ep.duration) + '</span>' : '') + '</div></div>' +
          (ep.cover_url
            ? '<img class="ep-cover" src="' + esc(ep.cover_url) + '" alt="">'
            : '<div class="ep-cover ph"><i class="fa-solid fa-microphone"></i></div>') +
          '<p class="ep-stats"><span title="Listens"><i class="fa-solid fa-headphones"></i><b id="ep-plays">' + (ep.plays || 0) + '</b> listens</span></p>' +
          '<audio class="ep-player" id="ep-audio" controls preload="metadata" src="' + esc(ep.audio_url) + '"></audio>' +
          '<div class="engage-row">' +
            '<button class="engage-btn ' + (liked ? "liked" : "") + '" id="like-btn" aria-pressed="' + liked + '">' +
              '<svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>' +
              '<span id="like-count">' + (ep.likes || 0) + '</span> Like</button>' +
            '<button class="engage-btn" id="share-btn">' +
              '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5 15.4 17.5M15.4 6.5 8.6 10.5"/></svg>Share</button>' +
          '</div>' +
          (ep.description ? '<div class="article-body ep-desc">' + esc(ep.description) + '</div>' : '') +
          '<div class="comments-section">' +
            '<h3 id="comments-heading">Comments</h3>' +
            '<form id="comment-form" class="comment-form">' +
              '<input id="comment-website" name="website" autocomplete="off" tabindex="-1" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" aria-hidden="true">' +
              '<input id="comment-name" placeholder="Your name (optional)" maxlength="60">' +
              '<textarea id="comment-text" placeholder="Write a comment..." required maxlength="1000"></textarea>' +
              '<button class="engage-btn" type="submit" id="comment-submit-btn">Post comment</button>' +
              '<p class="admin-status" id="comment-status"></p>' +
            '</form>' +
            '<div id="comments-list"></div>' +
          '</div>';

        /* Count one listen per device */
        document.getElementById("ep-audio").addEventListener("play", function () {
          var played = list("dg_pod_played");
          if (played.indexOf(ep.id) > -1) return;
          played.push(ep.id); save("dg_pod_played", played);
          supabaseClient.rpc("increment_podcast_plays", { p_id: ep.id }).then(function (r) {
            if (!r.error) {
              var el = document.getElementById("ep-plays");
              el.textContent = (parseInt(el.textContent, 10) || 0) + 1;
            }
          });
        });

        document.getElementById("like-btn").addEventListener("click", handleLike);
        document.getElementById("share-btn").addEventListener("click", handleShare);
        document.getElementById("comment-form").addEventListener("submit", handleComment);
        loadComments();
      }

      async function handleLike() {
        if (!ep || likeBusy) return;
        likeBusy = true;
        var btn = document.getElementById("like-btn");
        var countEl = document.getElementById("like-count");
        var likedList = list("dg_pod_liked");
        var was = likedList.indexOf(ep.id) > -1;
        var before = ep.likes || 0;
        var after = was ? Math.max(before - 1, 0) : before + 1;

        btn.classList.toggle("liked", !was);
        btn.setAttribute("aria-pressed", String(!was));
        countEl.textContent = after;

        var failed = false;
        try {
          var r = await supabaseClient.rpc(was ? "decrement_podcast_likes" : "increment_podcast_likes", { p_id: ep.id });
          if (r.error) failed = true;
        } catch (e) { failed = true; }

        if (failed) {
          btn.classList.toggle("liked", was);
          btn.setAttribute("aria-pressed", String(was));
          countEl.textContent = before;
          alert("Couldn't save that. Please try again.");
        } else {
          ep.likes = after;
          if (was) likedList = likedList.filter(function (x) { return x !== ep.id; });
          else likedList.push(ep.id);
          save("dg_pod_liked", likedList);
        }
        likeBusy = false;
      }

      function handleShare() {
        var url = location.href;
        if (navigator.share) {
          navigator.share({ title: ep.title, url: url }).catch(function () {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(function () { alert("Link copied to clipboard."); });
        }
      }

      async function loadComments() {
        var box = document.getElementById("comments-list");
        var r = await supabaseClient.from("podcast_comments").select("*")
          .eq("podcast_id", ep.id).order("created_at", { ascending: false });
        document.getElementById("comments-heading").textContent =
          "Comments" + (r.data && r.data.length ? " (" + r.data.length + ")" : "");
        if (r.error) { box.innerHTML = '<p class="admin-status error">Couldn\'t load comments.</p>'; return; }
        if (!r.data || !r.data.length) {
          box.innerHTML = '<p style="color:var(--muted);font-size:0.9rem">No comments yet. Be the first to say something.</p>';
          return;
        }
        box.innerHTML = r.data.map(function (c) {
          return '<div class="comment-item"><div class="comment-head"><strong>' + esc(c.name || "Anonymous") +
            '</strong><span class="meta">' + when(c.created_at) + '</span></div><p>' + esc(c.content) + '</p></div>';
        }).join("");
      }

      async function handleComment(e) {
        e.preventDefault();
        var nameEl = document.getElementById("comment-name");
        var textEl = document.getElementById("comment-text");
        var hp = document.getElementById("comment-website");
        var btn = document.getElementById("comment-submit-btn");
        var st = document.getElementById("comment-status");

        if (hp && hp.value.trim()) { textEl.value = ""; st.textContent = ""; return; }
        var content = textEl.value.trim();
        if (!content) return;

        btn.disabled = true;
        st.textContent = "Posting...";
        st.className = "admin-status";
        var r = await supabaseClient.from("podcast_comments").insert({
          podcast_id: ep.id,
          name: nameEl.value.trim() || "Anonymous",
          content: content
        });
        btn.disabled = false;
        if (r.error) {
          st.textContent = "Couldn't post your comment. Try again.";
          st.className = "admin-status error";
          return;
        }
        st.textContent = "";
        textEl.value = "";
        loadComments();
      }

      load();
    })();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>
</body>
