<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try { var t = localStorage.getItem("dg_theme") || localStorage.getItem("theme"); if (t === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
    })();
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6QHB1S6KFV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-6QHB1S6KFV");
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Listen to Davidgistmedia podcasts: entertainment, Nigeria, sports and business conversations.">
  <meta name="theme-color" content="#0d0d0d">
  <title>Podcasts | Davidgistmedia</title>

     crossorigin="anonymous"></script>

  <style>
    /* ---------- Header (same as the homepage) ---------- */
    :root{--h-bg:#ffffff;--h-ink:#141414;--h-muted:#666666;--h-line:#e3e3e3;--h-card:#f4f4f4;--h-red:#c8102e}
    html[data-theme="dark"]{--h-bg:#101010;--h-ink:#f0f0f0;--h-muted:#a6a6a2;--h-line:#2b2b2b;--h-card:#1b1b1b}
    .sp-util{background:var(--h-card);border-bottom:1px solid var(--h-line)}
    .sp-util .hd-in{max-width:1400px;margin:0 auto;padding:7px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--h-muted)}
    .sp-account{color:var(--h-ink);font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:65%;white-space:nowrap;padding:6px 0;text-decoration:none}
    .sp-account span{overflow:hidden;text-overflow:ellipsis}
    .sp-account img{flex:0 0 auto}
    .sp-top{background:#111;color:#fff}
    .sp-top .hd-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:6px}
    .sp-brand{margin-left:6px;font:700 1.5rem Georgia,"Times New Roman",serif;color:#fff;white-space:nowrap;text-decoration:none}
    .sp-brand span{color:#e8344c}
    .sp-spacer{flex:1}
    .sp-btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
    #menu-btn,#search-btn{border:0;width:36px;height:36px}
    .sp-drawer{background:#111;border-top:1px solid #2b2b2b}
    .sp-drawer .hd-in{max-width:1400px;margin:0 auto;padding:4px 20px 10px;display:flex;flex-direction:column}
    .sp-drawer a{padding:12px 0;border-bottom:1px solid #2b2b2b;color:#e6e6e6;font-weight:700;font-size:.95rem;text-decoration:none}
    .sp-drawer a:hover{color:#fff}
    .sp-search{background:var(--h-card);border-bottom:1px solid var(--h-line)}
    .sp-search form{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;gap:8px}
    .sp-search input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--h-line);border-radius:8px;background:var(--h-bg);color:var(--h-ink);font-size:1rem;font-family:inherit}
    .sp-search button{padding:11px 18px;border:0;border-radius:8px;background:var(--h-red);color:#fff;font-weight:800;cursor:pointer;font-family:inherit}
    .sp-drawer[hidden],.sp-search[hidden]{display:none !important}
    .sp-nav{position:sticky;top:0;z-index:30;background:var(--h-bg);border-bottom:1px solid var(--h-line)}
    .sp-nav .hd-in{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;overflow-x:auto;scrollbar-width:none}
    .sp-nav .hd-in::-webkit-scrollbar{display:none}
    .sp-nav a{flex:0 0 auto;padding:15px 15px 12px;font-weight:700;font-size:.95rem;color:var(--h-muted);border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none}
    .sp-nav a:hover{color:var(--h-ink)}
    .sp-nav a.on{color:var(--h-ink);border-bottom-color:var(--h-red)}
    @media (max-width:520px){
      .sp-top .hd-in{padding:10px 14px}
      .sp-brand{font-size:1.15rem}
      .sp-util .hd-in{padding:7px 14px}
      .sp-nav .hd-in{padding:0 8px}
    }
    @media (max-width:360px){
      .sp-brand{font-size:1.02rem}
      .sp-btn{width:30px;height:30px}
    }

    /* Night mode for the page itself */
    html[data-theme="dark"],body.dark-mode{--ink:#ececea;--paper:#1b1b1d;--page:#121213;--line:#2f2f31;--muted:#a3a3a0;--near-black:#0a0a0b;--red:#e8344c;color-scheme:dark}
    html[data-theme="dark"] body,body.dark-mode{background-color:#0d0d0d !important;color:#f0f0f0 !important}
    html[data-theme="dark"] .comment-form input,html[data-theme="dark"] .comment-form textarea{background:#242427;color:#ececea;border-color:#3a3a3d}
    html[data-theme="dark"] .empty-state{background:#18181a;border-color:#3a3a3d}
    html[data-theme="dark"] .engage-btn{color:#d6d6d3}

    .pod-page{max-width:760px;padding:22px 0 40px}
    .pod-page h1{font-family:var(--serif);font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.2;margin:0 0 6px}
    .pod-sub{color:var(--muted);margin:0 0 20px}
    .pod-list{border-top:2px solid var(--ink)}
    .pod-item{display:grid;grid-template-columns:104px 1fr;gap:0 16px;padding:20px 0;border-bottom:1px solid var(--line)}
    .pod-cover{width:104px;height:104px;object-fit:cover;background:var(--line);display:block}
    .pod-cover.ph{display:grid;place-items:center;color:var(--muted);font-size:1.8rem}
    .pod-item h2{font-family:var(--serif);font-size:1.1rem;line-height:1.25;font-weight:600;margin:0 0 6px}
    .pod-item h2 a:hover{color:var(--red)}
    .pod-meta{color:var(--muted);font-size:.85rem;margin:0 0 8px}
    .pod-stats{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.85rem;margin:0}
    .pod-stats i{margin-right:5px}
    .pod-item audio{grid-column:1 / -1;width:100%;margin-top:14px}
    /* Computers: the episodes fill the screen in two or three columns */
    @media (min-width:1000px){
      .pod-page{max-width:none;padding-left:48px;padding-right:48px}
      .pod-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
    }
    @media (min-width:1500px){
      .pod-list{grid-template-columns:repeat(3,minmax(0,1fr))}
    }

    /* Computers: use the whole width of the screen */
    @media (min-width:1000px){
      .sp-util .hd-in,.sp-top .hd-in,.sp-drawer .hd-in,.sp-nav .hd-in,.sp-search form{max-width:none;padding-left:48px;padding-right:48px}
    }
  </style>
</head>
<body>

      <span id="today"></span>
      <a class="sp-account" href="profile.html" id="top-account-link">Sign in</a>
    </div>
  </div>

  <div class="sp-top">
    <div class="hd-in">
      <button type="button" class="sp-btn" id="menu-btn" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button type="button" class="sp-btn" id="search-btn" aria-label="Search" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <a class="sp-brand" href="/">David<span>gistmedia</span></a>

      <a href="index.html">Home</a>

  <main class="wrap pod-page">
    <h1>Podcasts</h1>
    <p class="pod-sub">Conversations and stories from Davidgistmedia. Press play, or tap a title to like, comment and share.</p>
    <div class="pod-list" id="pod-list">

  <script src="js/footer.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/extras.js"></script>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      $("menu-btn").addEventListener("click", function () {
        var d = $("drawer"); d.hidden = !d.hidden;
        this.setAttribute("aria-expanded", String(!d.hidden));
      });
      $("search-btn").addEventListener("click", function () {
        var b = $("search-bar"); b.hidden = !b.hidden;
        this.setAttribute("aria-expanded", String(!b.hidden));
        if (!b.hidden) $("search-input").focus();
      });
      $("search-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var q = $("search-input").value.trim();
        if (q) location.href = "index.html?q=" + encodeURIComponent(q);
      });
      var today = $("today");
      if (today) {
        var shortDate = window.innerWidth < 600;
        today.textContent = new Date().toLocaleDateString("en-NG", shortDate
          ? { weekday: "short", day: "numeric", month: "short", year: "numeric" }
          : { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      }
      var themeIcon = $("theme-icon");
      var MOON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      var SUN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      function applyTheme(dark) {
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.body.classList.toggle("dark-mode", dark);
        themeIcon.innerHTML = dark ? SUN : MOON;
      }
      var saved = null;
      try { saved = localStorage.getItem("dg_theme") || localStorage.getItem("theme"); } catch (e) {}
      applyTheme(saved === "dark");
      $("theme-toggle-btn").addEventListener("click", function () {
        var dark = document.documentElement.getAttribute("data-theme") !== "dark";
        applyTheme(dark);
        try { localStorage.setItem("dg_theme", dark ? "dark" : "light"); localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      });
    })();

    function dgHeadEsc(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    /* shows the member's name and picture instead of "Sign in" when logged in */
    async function updateHeaderAccount() {
      const accountBtn = document.getElementById("top-account-link");
      if (!accountBtn || typeof supabaseClient === "undefined") return;
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          accountBtn.href = "profile.html";
          const { data: profile } = await supabaseClient.from("profiles").select("full_name, avatar_url").eq("id", user.id).single();
          const displayName = (profile && profile.full_name) || (user.user_metadata && user.user_metadata.full_name) || "My account";
          const avatarUrl = profile && profile.avatar_url;
          if (avatarUrl) {
            accountBtn.innerHTML = '<img src="' + dgHeadEsc(avatarUrl) + '" alt="" style="width:18px;height:18px;border-radius:50%;object-fit:cover;border:1px solid #e8344c;"><span>' + dgHeadEsc(displayName) + '</span>';
          } else {
            accountBtn.innerHTML = "<span>" + dgHeadEsc(displayName) + "</span>";
          }
        } else {
          accountBtn.textContent = "Sign in";
          accountBtn.href = "profile.html";
        }
      } catch (e) { console.error("Auth check error:", e); }
    }
    document.addEventListener("DOMContentLoaded", updateHeaderAccount);
  </script>

  <script>
    (async function () {
      var box = document.getElementById("pod-list");

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function day(d) {
        var t = new Date(d);
        if (isNaN(t.getTime())) return "";
        return t.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "Africa/Lagos" });
      }

      /* Count one listen per device per episode */
      function countPlay(id, el) {
        var k = "dg_pod_played", arr = [];
        try { arr = JSON.parse(localStorage.getItem(k) || "[]"); } catch (e) {}
        if (arr.indexOf(id) > -1) return;
        arr.push(id);
        try { localStorage.setItem(k, JSON.stringify(arr)); } catch (e) {}
        supabaseClient.rpc("increment_podcast_plays", { p_id: id }).then(function (r) {
          if (!r.error && el) el.textContent = (parseInt(el.textContent, 10) || 0) + 1;
        });
      }

      function item(p, comments) {
        var link = 'podcast.html?id=' + encodeURIComponent(p.id);
        return '<article class="pod-item">' +
          '<a href="' + link + '">' +
          (p.cover_url
            ? '<img class="pod-cover" src="' + esc(p.cover_url) + '" alt="" loading="lazy" decoding="async">'
            : '<div class="pod-cover ph"><i class="fa-solid fa-microphone"></i></div>') + '</a>' +
          '<div class="pod-body"><h2><a href="' + link + '">' + esc(p.title) + '</a></h2>' +
            '<div class="pod-meta">' + day(p.published_at) +
              (p.duration ? ' | ' + esc(p.duration) : '') +
              (p.host ? ' | ' + esc(p.host) : '') + '</div>' +
            '<p class="pod-stats">' +
              '<span title="Listens"><i class="fa-solid fa-headphones"></i><b data-plays="' + esc(p.id) + '">' + (p.plays || 0) + '</b></span>' +
              '<span title="Likes"><i class="fa-regular fa-heart"></i>' + (p.likes || 0) + '</span>' +
              '<span title="Comments"><i class="fa-regular fa-comment"></i>' + (comments || 0) + '</span>' +
            '</p>' +
          '</div>' +
          '<audio controls preload="none" data-id="' + esc(p.id) + '" src="' + esc(p.audio_url) + '"></audio>' +
        '</article>';
      }

      try {
        var res = await supabaseClient.from("podcasts").select("*")
          .order("published_at", { ascending: false }).limit(50);
        if (res.error) throw res.error;
        var list = res.data || [];
        if (!list.length) {
          box.innerHTML = '<div class="empty-state">No episodes yet. Check back soon.</div>';
          return;
        }

        var counts = {};
        try {
          var c = await supabaseClient.from("podcast_comments").select("podcast_id");
          (c.data || []).forEach(function (r) { counts[r.podcast_id] = (counts[r.podcast_id] || 0) + 1; });
        } catch (e) {}

        box.innerHTML = list.map(function (p) { return item(p, counts[p.id]); }).join("");

        var players = box.querySelectorAll("audio");
        players.forEach(function (p) {
          p.addEventListener("play", function () {
            players.forEach(function (o) { if (o !== p) o.pause(); });
            countPlay(p.dataset.id, box.querySelector('[data-plays="' + p.dataset.id + '"]'));
          });
        });
      } catch (e) {
        box.innerHTML = '<div class="empty-state">Couldn\'t load podcasts right now. Please try again later.</div>';
      }
    })();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
  </script>
</body>
